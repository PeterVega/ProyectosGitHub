  <script>
    const slides = [{"id":"c6-s1","slideNumber":1,"type":"cover","title":"Arquitectura de Software y Persistencia: El Cierre Maestro","subtitle":"Cómo organizar una aplicación real para que sea mantenible por equipos de 50 ingenieros","badge":"Semana 6 · Cátedra de Cierre","content":{"leadText":"Has dominado clases, encapsulamiento, herencia, polimorfismo y excepciones. Hoy veremos cómo unir todas las piezas en una arquitectura limpia.","bulletPoints":[{"icon":"🏗️","title":"Separación en Capas","desc":"Modelo (Datos) · Lógica de Negocio (Servicios) · Presentación (Consola / GUI)."},{"icon":"💾","title":"Persistencia de Datos (I/O)","desc":"Guardar y leer archivos en disco para que la información no desaparezca al apagar la computadora."},{"icon":"🎓","title":"Portafolio de Evidencias Completo","desc":"Consolidación de las 18 actividades prácticas desarrolladas a lo largo de las 6 semanas."}]},"speakerNotes":"Felicitar al grupo por llegar a la última semana. Mostrar cómo ahora son capaces de leer y entender código profesional en C# y Java."},{"id":"c6-s2","slideNumber":2,"type":"real_world_analogy","title":"El Problema de la Arquitectura: El Edificio con Tuberías Expuestas","subtitle":"¿Por qué no debes mezclar el cálculo de nómina con el botón que dibuja la pantalla?","badge":"Analogía Cotidiana","content":{"imageUrl":"/src/assets/images/persistence_stream_disk_1791519716297.jpg","imageCaption":"La memoria RAM es volátil; los objetos en ejecución se transmiten a través de Streams a almacenamiento permanente en disco (SSD)","analogyBox":{"title":"La Separación de Capas en un Rascacielos","analogy":"En un hotel de 5 estrellas, los huéspedes no entran a la sala de calderas para calentar su café, ni el chef sale a la recepción en medio del almuerzo a cambiar un foco de luz fundido. Tienes una capa de atención al cliente (Recepción/Presentación), una capa de servicio (Cocina/Lógica) y una capa de infraestructura física (Calderas/Persistencia).","moral":"Si mezclas la lógica matemática con la pantalla de consola, cuando quieras migrar a una app móvil tendrás que tirar todo el código a la basura."}},"speakerNotes":"Explicar el principio de Responsabilidad Única (SRP): una clase debe tener una sola razón para cambiar."},{"id":"c6-s3","slideNumber":3,"type":"topic_breakdown","title":"Módulo Temático 9A: Filosofía Defensiva y Control try-catch (U9.1 a U9.4)","subtitle":"Por qué no usar códigos de error, control de flujo anómalo, bloques múltiples y garantía con finally","badge":"Temario Oficial · Unidad 9 (Parte 1)","content":{"topicBreakdown":{"unitCode":"U9-A","unitTitle":"Manejo Formal de Excepciones y Flujo Defensivo","summary":"Los 4 fundamentos del blindaje de aplicaciones: propagación en el call stack, captura selectiva en cascada y liberación segura de recursos.","topics":[{"code":"U9.1","title":"Excepciones y Filosofía Defensiva","keyBadge":"Robustez de Software","whatItMeans":"Una excepción es un evento anómalo o error que ocurre mientras el programa se ejecuta (como dividir entre cero, archivo no encontrado o conexión perdida) y que rompe el flujo normal.","howToUse":"La programación defensiva sustituye los antiguos códigos numéricos de error (-1, 0, null) por objetos de excepción enriquecidos con mensajes y pila de llamadas.","appliedExample":{"scenario":"Retiro bancario sin fondos","csharpCode":"// C# .NET\nif (monto > Saldo)\n    throw new InvalidOperationException(\"Fondos insuficientes para la transacción.\");","javaCode":"// Java 17+\nif (monto > saldo)\n    throw new IllegalArgumentException(\"Fondos insuficientes.\");","visualAnalogyOrDiagram":"Airbag del auto: se dispara automáticamente en un choque para proteger al conductor."}},{"code":"U9.2","title":"Manejo de Excepciones en Java y C#","keyBadge":"Mecanismo de Control","whatItMeans":"Es la arquitectura de las máquinas virtuales (JVM y CLR) para capturar el error y trasladar la ejecución a una zona segura sin que la aplicación colapse ante el usuario.","howToUse":"Si un método lanza una excepción y nadie la captura, esta viaja hacia arriba en la pila de llamadas (call stack) hasta llegar al método main.","appliedExample":{"scenario":"Propagación de error desde el servicio hasta la pantalla","csharpCode":"// C# .NET\n// MetodoC() lanza -> MetodoB() propaga -> MetodoA() captura con try/catch","javaCode":"// Java 17+\n// metodoC() -> metodoB() -> metodoA()","visualAnalogyOrDiagram":"Alarma de incendios: suena en la oficina y se reporta al piso central de seguridad."}},{"code":"U9.3","title":"Sentencia try & catch (Múltiples Bloques)","keyBadge":"Captura Específica","whatItMeans":"El bloque \"try\" envuelve el código que podría fallar; el bloque \"catch\" contiene las instrucciones de rescate si ese fallo ocurre.","howToUse":"Puedes tener múltiples bloques catch. REGLA ESTRICTA: coloca siempre las excepciones más específicas arriba y la excepción general Exception al final.","appliedExample":{"scenario":"Conversión de texto a número con división","csharpCode":"// C# .NET\ntry {\n    int num = int.Parse(texto);\n    int res = 100 / num;\n} catch (FormatException ex) {\n    Console.WriteLine(\"Debes ingresar un número válido.\");\n} catch (DivideByZeroException ex) {\n    Console.WriteLine(\"No se puede dividir entre cero.\");\n}","javaCode":"// Java 17+\ntry {\n    int num = Integer.parseInt(texto);\n    int res = 100 / num;\n} catch (NumberFormatException e) {\n    System.out.println(\"Formato inválido\");\n} catch (ArithmeticException e) {\n    System.out.println(\"División entre cero\");\n}","visualAnalogyOrDiagram":"Red de seguridad para trapecistas: si fallas el salto, caes en la red suavemente."}},{"code":"U9.4","title":"Sentencia finally y Liberación de Recursos","keyBadge":"Garantía de Cierre","whatItMeans":"Es un bloque que se ejecuta SIEMPRE y sin excepción, tanto si todo salió bien como si ocurrió un error catastrófico. Es ideal para cerrar archivos, bases de datos o conexiones de red.","howToUse":"Escribe en el finally el cierre de recursos. En C# moderno se usa la sentencia \"using\" y en Java \"try-with-resources\" que automatizan esta limpieza.","appliedExample":{"scenario":"Cierre garantizado de un archivo en disco","csharpCode":"// C# .NET (con using automático)\nusing (StreamReader lector = new(\"datos.txt\")) {\n    string linea = lector.ReadLine();\n} // Se cierra automáticamente al salir","javaCode":"// Java 17+ (try-with-resources)\ntry (BufferedReader lector = new BufferedReader(new FileReader(\"datos.txt\"))) {\n    String linea = lector.readLine();\n} // Se cierra automáticamente","visualAnalogyOrDiagram":"Apagar las luces y cerrar con llave al salir del laboratorio, pase lo que pase."}}]}},"speakerNotes":"Explicar los 4 primeros temas de la Unidad 9: la filosofía defensiva, la pila de llamadas, la captura específica y el bloque finally."},{"id":"c6-s4","slideNumber":4,"type":"topic_breakdown","title":"Módulo Temático 9B: Categorías, Reglas de Oro y Excepciones Propias (U9.5 a P6.10)","subtitle":"Checked vs Unchecked, errores comunes del runtime, buenas prácticas y checklist del Producto Integrador","badge":"Temario Oficial · Unidad 9 (Parte 2)","content":{"topicBreakdown":{"unitCode":"U9-B","unitTitle":"Categorías de Excepciones, Reglas de Oro y Producto Integrador","summary":"Los 6 componentes finales: clasificación de excepciones, prohibición del catch vacío, excepciones personalizadas y checklist de entrega final.","topics":[{"code":"U9.5","title":"Categorías de Excepciones (Checked vs Unchecked)","keyBadge":"Jerarquía de Tipos","whatItMeans":"En Java, las \"Checked\" (heredan de Exception) obligan al programador a capturarlas con try-catch o declararlas con throws en tiempo de compilación. Las \"Unchecked\" (RuntimeException) son fallos de lógica (como dividir entre cero) que no exigen captura obligatoria. En C# todas son unchecked.","howToUse":"Usa excepciones verificadas (o validaciones previas) para fallos del entorno (red, archivos), y no uses try-catch para tapar errores de programación como índices fuera de rango.","appliedExample":{"scenario":"IOException (Checked en Java) vs NullPointerException (Unchecked)","csharpCode":"// C# .NET (Todas son desacopladas)\ntry { File.ReadAllText(\"cfg.json\"); } catch (FileNotFoundException) { }","javaCode":"// Java 17+\npublic void leerArchivo() throws IOException { // Declaración obligatoria\n    new FileReader(\"cfg.json\");\n}","visualAnalogyOrDiagram":"Inspección de aduana obligatoria (Checked) vs tropezar al caminar por descuido (Unchecked)."}},{"code":"U9.6","title":"Excepciones Comunes del Runtime","keyBadge":"Los Errores Clásicos","whatItMeans":"Los 4 errores que todo ingeniero encuentra a diario: NullReference/NullPointer (usar una variable que vale null), IndexOutOfRange (pedir el índice 10 de un arreglo de 5), FormatException (convertir \"hola\" a número) y ArithmeticException.","howToUse":"Aprende a leer el \"Stack Trace\" (la traza de la pila): te dice exactamente el nombre del archivo y el número de línea donde ocurrió la falla.","appliedExample":{"scenario":"Diagnóstico de NullReferenceException","csharpCode":"// C# .NET\nstring? nombre = null;\n// if (nombre.Length > 0) -> Falla con NullReference\nif (nombre != null && nombre.Length > 0) { /* Seguro */ }","javaCode":"// Java 17+\nString nombre = null;\nif (nombre != null && nombre.length() > 0) { /* Seguro */ }","visualAnalogyOrDiagram":"Placa de rayos X médica: te señala el hueso roto exacto en el cuerpo del programa."}},{"code":"U9.7","title":"Reglas de Oro para el Manejo de Excepciones","keyBadge":"Buenas Prácticas","whatItMeans":"Regla 1: NUNCA dejes un bloque catch vacío (esconder el error es el peor pecado). Regla 2: Captura solo lo que puedas solucionar. Regla 3: Si no lo puedes solucionar, regístralo (log) o relánzalo.","howToUse":"Evita: catch (Exception ex) { }. Usa: catch (Exception ex) { Logger.Error(ex); throw; } para preservar la información del problema.","appliedExample":{"scenario":"Registro profesional de error","csharpCode":"// C# .NET\ncatch (Exception ex) {\n    Console.Error.WriteLine($\"[ERROR CRÍTICO] {ex.Message}\");\n    throw; // Relanza la excepción conservando la traza original\n}","javaCode":"// Java 17+\ncatch (Exception e) {\n    System.err.println(\"[ERROR] \" + e.getMessage());\n    throw e;\n}","visualAnalogyOrDiagram":"Barril tóxico: no lo escondes debajo de la alfombra; lo señalizas y avisas a los bomberos."}},{"code":"U9.8","title":"Redefinición de Métodos y Cláusula throws","keyBadge":"Contrato en Herencia","whatItMeans":"Cuando una clase hija sobrescribe un método del padre, no puede declarar excepciones más amplias o generales de las que el padre ya había declarado.","howToUse":"En Java, si el padre declara throws IOException, la hija puede declarar FileNotFoundException (subclase) o no declarar ninguna, pero nunca throws Exception general.","appliedExample":{"scenario":"Sobrescritura segura en herencia","csharpCode":"// C# .NET: El contrato de la signatura virtual se respeta","javaCode":"// Java 17+\nclass Padre { void leer() throws IOException { } }\nclass Hija extends Padre {\n    @Override\n    void leer() throws FileNotFoundException { } // Válido: es más específica\n}","visualAnalogyOrDiagram":"Cláusula de garantía: una sucursal no puede dar menos garantías que la casa matriz."}},{"code":"U9.9","title":"Creando Excepciones Propias Personalizadas","keyBadge":"Excepciones del Dominio","whatItMeans":"Crear tus propias clases de error con nombres específicos del negocio (como SaldoInsuficienteException, ProductoAgotadoException) para que el código sea autodocumentado y claro.","howToUse":"Se crea una clase que herede de Exception (o ApplicationException/RuntimeException) y se le añade un constructor que reciba el mensaje descriptivo.","appliedExample":{"scenario":"Excepción del negocio bancario","csharpCode":"// C# .NET\npublic class SaldoInsuficienteException : Exception {\n    public double SaldoActual { get; }\n    public SaldoInsuficienteException(double saldo, string msg) : base(msg) {\n        SaldoActual = saldo;\n    }\n}","javaCode":"// Java 17+\npublic class SaldoInsuficienteException extends Exception {\n    public SaldoInsuficienteException(String msg) { super(msg); }\n}","visualAnalogyOrDiagram":"Etiqueta de diagnóstico especializada: no dice solo \"Falla de motor\", dice \"Bomba de inyección tapada\"."}},{"code":"P6.10","title":"Checklist de Entrega: Producto Integrador (Trabajo 5)","keyBadge":"Cierre de Asignatura","whatItMeans":"La verificación final de la solución de software que integra todo el contenido de Semanas 1 a 4 con el blindaje de excepciones de Semana 6.","howToUse":"Revisa: 1) Clases encapsuladas y limpias, 2) Herencia e interfaces polimórficas, 3) Menú por consola robusto, 4) Bloques try-catch en todas las entradas de usuario, y 5) Código libre de caídas.","appliedExample":{"scenario":"Demostración ante el docente titular","csharpCode":"// C# .NET: Sistema completamente blindado con menú, matrices, herencia y try/catch","javaCode":"// Java 17+: Compilación limpia sin advertencias y pruebas de consola exitosas","visualAnalogyOrDiagram":"Control de calidad final antes de lanzar un cohete al espacio."}}]}},"speakerNotes":"Explicar la diferencia entre Checked y Unchecked en Java, las reglas de oro para logging, cómo crear excepciones personalizadas y el checklist de entrega."},{"id":"c6-s5","slideNumber":5,"type":"core_concept_dual","title":"Concepto Clave: Bloques Try - Catch - Finally en C# y Java","subtitle":"Captura selectiva en cascada y garantía absoluta de liberación de recursos en finally","badge":"Control de Excepciones","content":{"codeComparison":{"concept":"Manejo defensivo con captura múltiple y bloque finally","csharpCode":"// C# .NET 8 (Try - Catch - Finally)\ntry\n{\n    Console.Write(\"Ingrese divisor: \");\n    int divisor = int.Parse(Console.ReadLine() ?? \"1\");\n    int resultado = 100 / divisor;\n    Console.WriteLine($\"Resultado exacto: {resultado}\");\n}\ncatch (DivideByZeroException ex)\n{\n    Console.WriteLine($\"⚠️ Error matemático: No se puede dividir entre cero ({ex.Message})\");\n}\ncatch (FormatException)\n{\n    Console.WriteLine(\"⚠️ Error de entrada: Ingrese un número entero válido.\");\n}\nfinally\n{\n    Console.WriteLine(\"🔒 Bloque finally: Garantía de cierre y recursos liberados.\");\n}","javaCode":"// Java JDK 17+ (Try - Catch - Finally)\ntry {\n    int divisor = Integer.parseInt(scanner.nextLine());\n    int resultado = 100 / divisor;\n    System.out.println(\"Resultado: \" + resultado);\n} catch (ArithmeticException ex) {\n    System.out.println(\"⚠️ Error matemático: \" + ex.getMessage());\n} catch (NumberFormatException ex) {\n    System.out.println(\"⚠️ Error de formato: Ingrese un entero válido.\");\n} finally {\n    System.out.println(\"🔒 Bloque finally ejecutado siempre.\");\n}","explanation":"El bloque \"finally\" se ejecuta SIEMPRE: tanto si todo salió bien como si ocurrió un error catastrófico. Es indispensable para cerrar archivos o conexiones a bases de datos."}},"speakerNotes":"Enfatizar que las excepciones específicas van arriba y la excepción genérica catch(Exception) va al final como último recurso."},{"id":"c6-s6","slideNumber":6,"type":"instruction_anatomy","title":"Anatomía de la Instrucción: Lanzamiento de una Excepción Propia","subtitle":"Desglose paso a paso de la creación y lanzamiento defensivo con \"throw new\"","badge":"⭐ Anatomía Visual de la Instrucción","content":{"instructionAnatomy":{"instructionStatement":"if (monto > Saldo) throw new SaldoInsuficienteException(\"Fondos insuficientes\");","statementContext":"La forma profesional de decir: \"Esta operación viola la regla de negocio; aborto de inmediato antes de corromper los datos\".","parts":[{"token":"if (monto > Saldo)","name":"1. Cláusula de Guardia","role":"Condición preventiva que evalúa si la regla de negocio ha sido vulnerada.","everydayAnalogy":"El guardia de seguridad en el cajero verificando si tu saldo cubre el retiro.","color":"amber"},{"token":"throw","name":"2. Palabra Clave \"throw\"","role":"Orden imperativa al runtime: \"¡Detén la ejecución normal de esta función y detona una alarma estructurada!\".","everydayAnalogy":"Tirar de la palanca roja de emergencia en una estación de tren.","color":"rose"},{"token":"new","name":"3. Instanciador \"new\"","role":"Crea en el Heap un objeto real que contendrá la traza de error y el mensaje explicativo.","everydayAnalogy":"Llenar el reporte oficial del incidente con fecha, hora y causa.","color":"emerald"},{"token":"SaldoInsuficienteException(...)","name":"4. Clase de Excepción Propia","role":"Un tipo de dato especializado que hereda de Exception para describir el problema exacto del dominio.","everydayAnalogy":"El código específico de alarma: no es \"error general\", es \"falta de fondos\".","color":"purple"},{"token":"\"Fondos insuficientes\"","name":"5. Mensaje Amigable para el Log","role":"Texto descriptivo que viajará encapsulado en la propiedad .Message para informar al usuario o al log.","everydayAnalogy":"El mensaje que aparece en la pantalla del cajero: \"Saldo insuficiente para esta transacción\".","color":"cyan"}],"takeaway":"Lanzar excepciones deliberadas con \"throw\" es la marca de un desarrollador senior: proteges tu código de trabajar con basura."}},"speakerNotes":"Mostrar que una excepción personalizada en C# hereda de Exception: public class SaldoInsuficienteException : Exception { public SaldoInsuficienteException(string m) : base(m) {} }."},{"id":"c6-s7","slideNumber":7,"type":"simple_example","title":"Ejemplo Sencillo en Vivo: Cajero Automático con Excepción Propia","subtitle":"Código de 25 líneas en C# listo para compilar, probar y blindar","badge":"Código Ejecutable","content":{"simpleExample":{"domainScenario":"Retiro bancario que lanza SaldoInsuficienteException cuando el monto supera el saldo disponible.","csharpSnippet":"using System;\n\n// 1. Excepción Personalizada del Negocio\npublic class SaldoInsuficienteException : Exception\n{\n    public SaldoInsuficienteException(string mensaje) : base(mensaje) { }\n}\n\npublic class Cuenta\n{\n    public double Saldo { get; private set; } = 300;\n\n    public void Retirar(double monto)\n    {\n        if (monto > Saldo)\n            throw new SaldoInsuficienteException($\"No puedes retirar ${monto}. Saldo disponible: ${Saldo}\");\n\n        Saldo -= monto;\n        Console.WriteLine($\"Retiro exitoso de ${monto}. Nuevo saldo: ${Saldo}\");\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Cuenta c = new Cuenta();\n        try\n        {\n            c.Retirar(100); // Exitoso\n            c.Retirar(500); // ¡Detonará la excepción controlada!\n        }\n        catch (SaldoInsuficienteException ex)\n        {\n            Console.WriteLine($\"🛡️ Alarma Atrapada: {ex.Message}\");\n        }\n        finally\n        {\n            Console.WriteLine(\"🏧 Transacción finalizada. Gracias por usar nuestro cajero.\");\n        }\n    }\n}","javaSnippet":"// Equivalente en Java 17+ heredando de Exception y usando try-catch","consoleOutput":"Retiro exitoso de $100. Nuevo saldo: $200\n🛡️ Alarma Atrapada: No puedes retirar $500. Saldo disponible: $200\n🏧 Transacción finalizada. Gracias por usar nuestro cajero.","stepByStepExplanation":["El primer retiro de $100 se procesa normalmente.","El segundo retiro de $500 detona throw new SaldoInsuficienteException(...).","El programa NO colapsa; el bloque catch captura el mensaje y el bloque finally imprime el mensaje de despedida."]}},"speakerNotes":"Hacer notar a los estudiantes que el programa terminó con código de salida 0 (sin estrellarse en la pantalla azul de la muerte)."},{"id":"c6-s8","slideNumber":8,"type":"common_mistakes","title":"El Antipatrón del \"Catch Vacío\" (Tragarse los Errores)","subtitle":"El peor pecado de programación: atrapar un fallo y quedarse callado","badge":"Peligro Crítico","content":{"commonMistakes":[{"wrongCode":"// ❌ EL PECADO MORTAL: CATCH VACÍO\ntry {\n    GuardarEnBaseDatos();\n} catch (Exception) {\n    // ¡Vacío! No hace nada...\n}","wrongExplanation":"Tragarse la excepción silencia el error. La base de datos falló, los datos no se guardaron, pero el sistema continúa fingiendo que todo está bien. Los usuarios perderán información sin enterarse.","rightCode":"// ✅ CAPTURA RESPONSABLE\ntry {\n    GuardarEnBaseDatos();\n} catch (Exception ex) {\n    RegistrarEnLogDeErrores(ex);\n    NotificarAlUsuario(\"No se pudo completar la operación. Intente más tarde.\");\n}","rightExplanation":"Siempre registra el fallo (log) y ofrece una alternativa elegante al usuario.","ruleOfThumb":"Nunca escribas un bloque catch vacío; si lo atrapas, hazte responsable de él."},{"wrongCode":"// ❌ ERROR: Usar excepciones para control de flujo\ntry {\n    while (true) { procesar(items[i++]); }\n} catch (IndexOutOfRangeException) { /* fin de lista */ }","wrongExplanation":"Las excepciones son para situaciones ANÓMALAS. Crear y lanzar una excepción cuesta cientos de ciclos de CPU comparado con una simple condición if (i < items.Length).","rightCode":"// ✅ CONTROL DE FLUJO NATURAL\nfor (int i = 0; i < items.Length; i++) {\n    procesar(items[i]);\n}","rightExplanation":"Usa bucles e ifs para el flujo ordinario; reserva try-catch para eventos inesperados.","ruleOfThumb":"No uses excepciones para controlar el flujo normal del programa."}]},"speakerNotes":"Explicar anécdotas reales de software que falló durante meses en producción porque alguien puso un catch vacío."},{"id":"c6-s9","slideNumber":9,"type":"classroom_challenge","title":"Reto de Blindaje: Creación de CapacidadExcedidaException","subtitle":"Diseña una excepción propia y pruébala en 5 minutos","badge":"Reto de Aula (5 min)","content":{"challenge":{"timeMinutes":5,"question":"Diseña CapacidadExcedidaException para el Producto Integrador","instructions":"Escribe la clase de excepción y la cláusula de guardia que verifique si la carga supera la capacida           inner += '      <p class="text-emerald-200">' + cm.rightExplanation + '</p>';
          inner += '    </div>';
          inner += '  </div>';
          inner += '  <div class="p-2.5 rounded-xl border border-amber-500/30 bg-amber-950/20 text-xs text-amber-300 text-center font-bold">⭐ Regla de Oro: ' + cm.ruleOfThumb + '</div>';
        });
        inner += '</div>';
      } else if (slide.type === 'classroom_challenge' && slide.content.challenge) {
        const ch = slide.content.challenge;
        inner += '<div class="space-y-4 max-w-xl mx-auto text-center">';
        inner += '  <span class="px-3 py-1 rounded-full bg-amber-500/20 border border-amber-500/30 text-amber-300 font-bold text-xs">⏱️ Tiempo: ' + ch.timeMinutes + ' minutos</span>';
        inner += '  <div class="p-6 rounded-2xl border border-slate-800 bg-black space-y-2">';
        inner += '    <h3 class="text-xl font-bold text-white">' + ch.question + '</h3>';
        inner += '    <p class="text-xs text-slate-300">' + ch.instructions + '</p>';
        inner += '  </div>';
        inner += '  <div class="p-4 rounded-xl border border-emerald-500/30 bg-emerald-950/20 text-xs text-emerald-300 text-left"><strong>✓ Respuesta Sugerida:</strong><p class="mt-1">' + ch.expectedAnswer + '</p></div>';
        inner += '</div>';
      } else if (slide.type === 'weekly_activity_bridge' && slide.content.activityBridge) {
        const ab = slide.content.activityBridge;
        inner += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">';
        inner += '  <div class="p-4 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-black text-[10px] uppercase">Actividad 1: Básica</span><h4 class="font-bold text-white">' + ab.act1Title + '</h4><p class="text-slate-400">' + ab.act1Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-blue-500/30 bg-blue-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-black text-[10px] uppercase">Actividad 2: Intermedia</span><h4 class="font-bold text-white">' + ab.act2Title + '</h4><p class="text-slate-400">' + ab.act2Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-purple-500/30 bg-purple-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-black text-[10px] uppercase">Actividad 3: Entregable</span><h4 class="font-bold text-white">' + ab.act3Title + '</h4><p class="text-slate-400">' + ab.act3Desc + '</p></div>';
        inner += '</div>';
      }

      card.innerHTML = inner;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = slides.length - 1;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function selectAnatomy(idx) {
      selectedAnatomyIndex = idx;
      renderSlide();
    }

    function selectTopic(idx) {
      selectedTopicIndex = idx;
      renderSlide();
    }

    function toggleTopicGrid() {
      showAllTopicsGrid = !showAllTopicsGrid;
      renderSlide();
    }

    function toggleLang() {
      currentLang = currentLang === 'csharp' ? 'java' : 'csharp';
      const btn = document.getElementById('btn-lang');
      btn.textContent = currentLang === 'csharp' ? 'C# .NET' : 'Java 17';
      btn.className = currentLang === 'csharp'
        ? 'px-2.5 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold transition-all'
        : 'px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 text-xs font-black transition-all';
      renderSlide();
    }

    function toggleTheme() {
      isDark = !isDark;
      document.body.className = isDark
        ? 'bg-slate-950 text-slate-100 min-h-screen flex flex-col'
        : 'bg-slate-100 text-slate-900 min-h-screen flex flex-col';
      const card = document.getElementById('slide-card');
      if (card) {
        card.className = isDark
          ? 'bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl min-h-[580px] flex flex-col justify-between transition-all'
          : 'bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-xl min-h-[580px] flex flex-col justify-between transition-all';
      }
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    renderSlide();
  </script>
</body>
</html>
