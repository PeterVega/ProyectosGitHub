  <script>
    const slides = [{"id":"c3-s1","slideNumber":1,"type":"cover","title":"Herencia: El Arte de no Repetir Código (Principio DRY)","subtitle":"Jerarquías de clases donde los hijos heredan la riqueza de los padres y agregan su propia especialización","badge":"Semana 3 · Cátedra Oficial","content":{"leadText":"Hoy eliminaremos el código duplicado creando árboles genealógicos de software elegantes y escalables.","bulletPoints":[{"icon":"🧬","title":"La Relación \"Es-Un\"","desc":"Un Médico \"es una\" Persona; un Auto \"es un\" Vehículo; un Desarrollador \"es un\" Empleado."},{"icon":"🔁","title":"Reutilización Máxima (DRY)","desc":"Escribe una sola vez el Nombre y la Cédula en la clase Padre, y todas las clases Hijas lo tendrán gratis."},{"icon":"⚡","title":"Sobrescritura Polimórfica","desc":"Palabras clave: virtual y override en C#; @Override en Java."}]},"speakerNotes":"Preguntar al grupo: \"¿Quién ha copiado y pegado código 10 veces en diferentes archivos?\". Explicar que la herencia es la solución profesional para no duplicar jamás."},{"id":"c3-s2","slideNumber":2,"type":"real_world_analogy","title":"El Problema del Mundo Real: El Catálogo de Vehículos Duplicado","subtitle":"La diferencia entre copiar planos y especializar modelos","badge":"Analogía Cotidiana","content":{"imageUrl":"/src/assets/images/inheritance_hierarchy_1791519185121.jpg","imageCaption":"La clase base Entity provee los cimientos (ID, Nombre); las clases hijas heredan y agregan herramientas especializadas.","analogyBox":{"title":"El ADN Biológico y los Modelos de Automóviles","analogy":"Una fábrica no inventa la rueda, los frenos y el volante desde cero cada vez que diseña una camioneta o un convertible. Tienen una plataforma base (\"Vehículo\") que ya incluye motor, chasis y frenos. La Camioneta hereda todo eso y solo agrega \"Caja de carga 4x4\"; el Deportivo hereda lo mismo y solo agrega \"Modo turbo\".","moral":"Herencia significa: \"No reinventes la rueda; hereda lo que funciona y especializa lo que cambia\"."}},"speakerNotes":"Usar la analogía del chasis de automóvil. Dejar claro que la clase hija tiene acceso a lo protegido (protected/public) del padre pero no a lo estrictamente privado."},{"id":"c3-s3","slideNumber":3,"type":"topic_breakdown","title":"Módulo Temático 5: Sentencias de Control (U5.1 a U5.5)","subtitle":"Bifurcaciones if-else, switch-case y ciclos iterativos for, while y do-while","badge":"Temario Oficial · Unidad 5","content":{"topicBreakdown":{"unitCode":"U5","unitTitle":"Estructuras de Control de Flujo Algorítmico","summary":"Las 5 sentencias clave para bifurcar la ejecución de programas y automatizar repeticiones con condiciones de parada.","topics":[{"code":"U5.1","title":"Sentencia if-else","keyBadge":"Bifurcación Condicional","whatItMeans":"Es la encrucijada del código: evalúa una condición booleana. Si es verdadera ejecuta un camino; si es falsa ejecuta el bloque else.","howToUse":"Se usa para validar condiciones de negocio. Para múltiples casos excluyentes se encadenan con \"else if\". Mantén las condiciones simples para evitar anidamientos profundos.","appliedExample":{"scenario":"Semáforo de límite de velocidad","csharpCode":"// C# .NET\nif (velocidad > 100) {\n    Console.WriteLine(\"Multa grave\");\n} else if (velocidad > 80) {\n    Console.WriteLine(\"Advertencia\");\n} else {\n    Console.WriteLine(\"Velocidad normal\");\n}","javaCode":"// Java 17+\nif (velocidad > 100) {\n    System.out.println(\"Multa grave\");\n} else {\n    System.out.println(\"Velocidad normal\");\n}","visualAnalogyOrDiagram":"Bifurcación en la carretera: tomas la salida A o sigues por la ruta B según el letrero."}},{"code":"U5.2","title":"Sentencia switch-case","keyBadge":"Selección Múltiple","whatItMeans":"Compara una sola variable contra una lista de valores posibles fijos (constantes). Es mucho más rápido y ordenado que escribir 10 \"else if\" seguidos.","howToUse":"En sintaxis tradicional cada \"case\" termina con \"break;\". En C# y Java modernos existen las expresiones switch con flecha \"=>\" que devuelven un valor directamente sin break.","appliedExample":{"scenario":"Menú de opciones de cajero","csharpCode":"// C# .NET (Switch moderno)\nstring accion = opcion switch {\n    1 => \"Consultar saldo\",\n    2 => \"Depositar efectivo\",\n    3 => \"Retirar dinero\",\n    _ => \"Opción no válida\"\n};","javaCode":"// Java 17+ (Switch moderno)\nString accion = switch (opcion) {\n    case 1 -> \"Consultar saldo\";\n    case 2 -> \"Depositar\";\n    default -> \"No válida\";\n};","visualAnalogyOrDiagram":"Botones del elevador: presionas el piso 3 y te lleva directo sin pasar por cada piso intermedio."}},{"code":"U5.3","title":"Ciclo for","keyBadge":"Iteración de Conteo","whatItMeans":"Es el bucle ideal cuando sabes de antemano exactamente cuántas veces quieres repetir algo (por ejemplo, recorrer 10 alumnos o los elementos de un arreglo).","howToUse":"Se estructura en 3 partes: inicialización del contador (int i = 0), condición de parada (i < limite) e incremento (i++).","appliedExample":{"scenario":"Cálculo del total de ventas del día","csharpCode":"// C# .NET\ndouble suma = 0;\nfor (int i = 0; i < ventas.Length; i++) {\n    suma += ventas[i];\n}","javaCode":"// Java 17+\ndouble suma = 0;\nfor (int i = 0; i < ventas.length; i++) {\n    suma += ventas[i];\n}","visualAnalogyOrDiagram":"Cuenta vueltas de pista atlética: vuelta 1, vuelta 2... hasta completar las 5 vueltas."}},{"code":"U5.4","title":"Ciclo while","keyBadge":"Condición de Entrada","whatItMeans":"Repite un bloque de código mientras una condición siga siendo verdadera. Si la condición es falsa desde el principio, el bucle NO se ejecuta ni una sola vez.","howToUse":"Se usa cuando no sabes cuántas veces se repetirá el ciclo (ej. leer un archivo hasta que termine o esperar a que el usuario escriba \"salir\").","appliedExample":{"scenario":"Simulación de descarga de batería","csharpCode":"// C# .NET\nwhile (bateria > 5) {\n    ConsumirEnergia();\n    bateria -= 2; // Asegurar que avance hacia la condición de fin\n}","javaCode":"// Java 17+\nwhile (bateria > 5) {\n    consumirEnergia();\n    bateria -= 2;\n}","visualAnalogyOrDiagram":"Torniquete del metro: mientras la tarjeta tenga saldo, te deja seguir pasando."}},{"code":"U5.5","title":"Ciclo do-while","keyBadge":"Garantía Mínima","whatItMeans":"Es idéntico al while, pero con una diferencia vital: la condición se comprueba AL FINAL. Por lo tanto, garantiza que el código se ejecutará al menos una vez obligatoriamente.","howToUse":"Es la estructura predilecta para menús interactivos por consola donde primero debes mostrar las opciones y luego preguntar si desea repetir.","appliedExample":{"scenario":"Menú interactivo de opciones","csharpCode":"// C# .NET\nint opcion;\ndo {\n    MostrarMenu();\n    opcion = int.Parse(Console.ReadLine() ?? \"0\");\n} while (opcion != 9); // Sale al presionar 9","javaCode":"// Java 17+\ndo {\n    mostrarMenu();\n    opcion = scanner.nextInt();\n} while (opcion != 9);","visualAnalogyOrDiagram":"Probar un bocado de comida: primero lo pruebas, y luego decides si te sirves más."}}]}},"speakerNotes":"Explicar las 5 sentencias de control: el if-else, el switch moderno, y la diferencia vital entre while (precondición) y do-while (al menos una ejecución garantizada)."},{"id":"c3-s4","slideNumber":4,"type":"topic_breakdown","title":"Módulo Temático 6: Arreglos y Matrices (U6.1 a U6.6)","subtitle":"Declaración, reserva con new, matrices multidimensionales, redimensión y copiado en memoria","badge":"Temario Oficial · Unidad 6","content":{"topicBreakdown":{"unitCode":"U6","unitTitle":"Arreglos Unidimensionales y Multidimensionales","summary":"Los 6 fundamentos de gestión de colecciones contiguas en memoria Heap, índices con base cero y prevención de desbordamientos.","topics":[{"code":"U6.1","title":"Declaración de Arreglos","keyBadge":"Sintaxis en Stack","whatItMeans":"Es avisarle al compilador que una variable guardará una colección contigua de datos del mismo tipo, en lugar de un solo valor.","howToUse":"Se escribe tipo[] nombre (ej. int[] numeros; o string[] nombres;). En esta fase la variable vive en el Stack y aún vale null; todavía no contiene elementos.","appliedExample":{"scenario":"Declaración de lista de calificaciones","csharpCode":"// C# .NET\ndouble[] calificaciones; // Variable declarada (apunta a null)","javaCode":"// Java 17+\ndouble[] calificaciones;","visualAnalogyOrDiagram":"Etiqueta en una gaveta vacía: dice \"Aquí irán zapatos\", pero la gaveta aún no existe."}},{"code":"U6.2","title":"Creación de Arreglos (con new)","keyBadge":"Reserva en Heap","whatItMeans":"Es cuando la máquina virtual reserva un bloque de memoria física continua de tamaño fijo en el Heap para guardar los elementos.","howToUse":"Se usa el operador new con el tamaño entre corchetes: new int[5];. Los índices comienzan siempre en 0 y terminan en tamaño - 1.","appliedExample":{"scenario":"Reserva para 5 calificaciones","csharpCode":"// C# .NET\ncalificaciones = new double[5]; // Espacios de memoria indexados [0..4]","javaCode":"// Java 17+\ncalificaciones = new double[5];","visualAnalogyOrDiagram":"Caja de 5 compartimentos numerados del 0 al 4 construida físicamente."}},{"code":"U6.3","title":"Inicialización de Arreglos","keyBadge":"Llenado de Datos","whatItMeans":"Asignar los valores iniciales a cada posición del arreglo, ya sea uno por uno con su índice o todos juntos en una sola línea (inline).","howToUse":"Sintaxis compacta: int[] primos = { 2, 3, 5, 7, 11 };. Los valores se asignan en orden posicional.","appliedExample":{"scenario":"Días laborables de la semana","csharpCode":"// C# .NET\nstring[] dias = { \"Lunes\", \"Martes\", \"Miércoles\", \"Jueves\", \"Viernes\" };\nConsole.WriteLine(dias[0]); // \"Lunes\"","javaCode":"// Java 17+\nString[] dias = { \"Lunes\", \"Martes\", \"Miércoles\", \"Jueves\", \"Viernes\" };\nSystem.out.println(dias[0]);","visualAnalogyOrDiagram":"Llenar los compartimentos numerados con sus respectivos objetos."}},{"code":"U6.4","title":"Arreglos Multidimensionales (Matrices)","keyBadge":"Cuadrículas 2D","whatItMeans":"Son arreglos con dos o más dimensiones (filas y columnas), ideales para modelar tablas de datos, tableros de juego o imágenes con píxeles.","howToUse":"En C# existen matrices rectangulares [filas, cols] y arreglos escalonados [][]. En Java son siempre arreglos de arreglos tipo[][]. Se recorren con bucles for anidados.","appliedExample":{"scenario":"Tablero de 3x3 para juego de gato (Tres en línea)","csharpCode":"// C# .NET (Matriz 2D rectangular)\nchar[,] tablero = new char[3, 3];\ntablero[0, 0] = 'X'; // Fila 0, Columna 0","javaCode":"// Java 17+ (Matriz 2D)\nchar[][] tablero = new char[3][3];\ntablero[0][0] = 'X';","visualAnalogyOrDiagram":"Hoja de cálculo de Excel: coordenadas (fila, columna) para ubicar cada celda."}},{"code":"U6.5","title":"Redimensión de Arreglos","keyBadge":"Inmutabilidad de Tamaño","whatItMeans":"Los arreglos estándar tienen tamaño fijo e inalterable en memoria. \"Redimensionar\" en realidad significa crear un arreglo nuevo más grande y copiar los elementos viejos al nuevo.","howToUse":"En C# se usa Array.Resize(ref miArreglo, nuevoTam);. En Java se usa Arrays.copyOf(original, nuevoTam).","appliedExample":{"scenario":"Expandir la capacidad de una lista de 3 a 5 elementos","csharpCode":"// C# .NET\nint[] datos = { 10, 20, 30 };\nArray.Resize(ref datos, 5); // Crea nuevo array y copia los 3 viejos","javaCode":"// Java 17+\nint[] datos = { 10, 20, 30 };\ndatos = java.util.Arrays.copyOf(datos, 5);","visualAnalogyOrDiagram":"Mudanza a una casa más grande: compras otra casa y trasladas todos tus muebles."}},{"code":"U6.6","title":"Copiado de Arreglos","keyBadge":"Copia por Valor vs Referencia","whatItMeans":"Hacer \"arregloB = arregloA\" NO copia los datos, solo copia la dirección de memoria (ambos quedan apuntando a la misma caja). Para tener dos copias independientes debes duplicar los elementos.","howToUse":"En C# usa Array.Copy(origen, destino, longitud). En Java usa System.arraycopy(...) o el método .clone().","appliedExample":{"scenario":"Crear un respaldo de seguridad de datos","csharpCode":"// C# .NET (Copia independiente en memoria)\nint[] original = { 1, 2, 3 };\nint[] respaldo = new int[original.Length];\nArray.Copy(original, respaldo, original.Length);","javaCode":"// Java 17+\nint[] original = { 1, 2, 3 };\nint[] respaldo = original.clone();","visualAnalogyOrDiagram":"Fotocopia de un documento: escribir en la copia no mancha el original."}}]}},"speakerNotes":"Explicar los 6 temas de arreglos: desde la reserva de memoria con new tipo[tam] hasta las matrices 2D [,] y la diferencia entre copiar referencias y copiar valores."},{"id":"c3-s5","slideNumber":5,"type":"core_concept_dual","title":"Concepto Clave: Herencia y Constructor Base en C# y Java","subtitle":"Cómo declarar la relación de herencia y reenviar parámetros al padre","badge":"Sintaxis de Herencia","content":{"codeComparison":{"concept":"Clase Padre Empleado y Clase Hija Desarrollador","csharpCode":"// C# .NET 8 (Se usa el símbolo \":\" y \"base\")\npublic class Empleado\n{\n    public string Nombre { get; set; }\n    public Empleado(string nombre) => Nombre = nombre;\n\n    public virtual void Trabajar() => Console.WriteLine($\"{Nombre} realiza labores generales.\");\n}\n\npublic class Desarrollador : Empleado\n{\n    public string Lenguaje { get; set; }\n    // Reenvío al constructor base\n    public Desarrollador(string nombre, string lenguaje) : base(nombre)\n    {\n        Lenguaje = lenguaje;\n    }\n\n    public override void Trabajar() => Console.WriteLine($\"{Nombre} programa código en {Lenguaje}.\");\n}","javaCode":"// Java (Se usa \"extends\" y \"super\")\npublic class Empleado {\n    protected String nombre;\n    public Empleado(String nombre) { this.nombre = nombre; }\n\n    public void trabajar() {\n        System.out.println(nombre + \" realiza labores generales.\");\n    }\n}\n\npublic class Desarrollador extends Empleado {\n    private String lenguaje;\n    public Desarrollador(String nombre, String lenguaje) {\n        super(nombre); // Reenvío al padre\n        this.lenguaje = lenguaje;\n    }\n\n    @Override\n    public void trabajar() {\n        System.out.println(nombre + \" programa código en \" + lenguaje);\n    }\n}","explanation":"En C# se usa \":\" y \"base(...)\"; en Java se usa \"extends\" y \"super(...)\". En C# el padre debe marcar el método con \"virtual\" y el hijo con \"override\"."}},"speakerNotes":"Subrayar la importancia de \": base(nombre)\" en C# y \"super(nombre)\" en Java. El padre debe nacer antes de que el hijo pueda existir."},{"id":"c3-s6","slideNumber":6,"type":"instruction_anatomy","title":"Anatomía de la Instrucción: Declaración de Herencia y Constructor Base","subtitle":"Desglose detallado de la sintaxis de herencia en C#","badge":"⭐ Anatomía Visual de la Instrucción","content":{"instructionAnatomy":{"instructionStatement":"public class Medico : Persona { public Medico(string n, string esp) : base(n) { Especialidad = esp; } }","statementContext":"Esta línea establece la filiación completa entre la clase derivada y su clase base, asegurando la inicialización correcta.","parts":[{"token":"class Medico","name":"1. Subclase / Clase Hija","role":"Declara el nuevo tipo especializado que heredará los atributos del padre.","everydayAnalogy":"El hijo que nace en una familia.","color":"purple"},{"token":":","name":"2. Operador de Herencia (:)","role":"En C# indica: \"Esta clase hereda de...\". En Java se sustituye por la palabra \"extends\".","everydayAnalogy":"La rama del árbol genealógico que une al hijo con el padre.","color":"amber"},{"token":"Persona","name":"3. Superclase / Clase Padre","role":"La clase base que contiene los datos comunes a todos los seres humanos (Nombre, Cédula).","everydayAnalogy":"El padre que aporta los cimientos genéticos.","color":"blue"},{"token":"public Medico(string n, string esp)","name":"4. Constructor del Hijo","role":"Recibe tanto los datos necesarios para el padre como los específicos del hijo.","everydayAnalogy":"El formulario de ingreso con datos generales y de especialidad médica.","color":"emerald"},{"token":": base(n)","name":"5. Delegación al Constructor Base","role":"Pasa inmediatamente el parámetro \"n\" al constructor de Persona para que el padre se inicialice primero.","everydayAnalogy":"Pasarle el pasaporte a la oficina central para que te identifique.","color":"rose"},{"token":"{ Especialidad = esp; }","name":"6. Inicialización Especializada","role":"Guarda únicamente los atributos nuevos y únicos de la subclase Médica.","everydayAnalogy":"Ponerte la bata y el estetoscopio que solo los médicos usan.","color":"cyan"}],"takeaway":"La clase hija nunca necesita volver a declarar \"public string Nombre\"; ya lo heredó del padre con cero esfuerzo."}},"speakerNotes":"Explicar que en la memoria RAM, un objeto Médico contiene dentro de sí la porción de Persona y la porción de Médico de manera continua."},{"id":"c3-s7","slideNumber":7,"type":"simple_example","title":"Ejemplo Práctico en Vivo: Sistema de Cuentas Bancarias","subtitle":"Cuenta base con saldo, y CuentaAhorro con tasa de interés","badge":"Código Ejecutable","content":{"simpleExample":{"domainScenario":"Heredar de CuentaBancaria para crear una CuentaAhorro que pague intereses mensuales.","csharpSnippet":"using System;\n\npublic class Cuenta\n{\n    public string Numero { get; set; }\n    public double Saldo { get; protected set; }\n\n    public Cuenta(string num, double saldoInicial)\n    {\n        Numero = num;\n        Saldo = saldoInicial;\n    }\n\n    public virtual void Depositar(double monto)\n    {\n        Saldo += monto;\n        Console.WriteLine($\"Depósito exitoso en {Numero}. Saldo: ${Saldo}\");\n    }\n}\n\n// Subclase especializada\npublic class CuentaAhorro : Cuenta\n{\n    public double TasaInteres { get; set; }\n\n    public CuentaAhorro(string num, double saldo, double tasa) : base(num, saldo)\n    {\n        TasaInteres = tasa;\n    }\n\n    public void AplicarInteres()\n    {\n        double interes = Saldo * TasaInteres;\n        Depositar(interes);\n        Console.WriteLine($\"🎉 Interés acreditado: +${interes}\");\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        CuentaAhorro ahorro = new CuentaAhorro(\"AH-101\", 1000, 0.05);\n        ahorro.Depositar(200);   // Método heredado de Cuenta\n        ahorro.AplicarInteres(); // Método propio de CuentaAhorro\n    }\n}","javaSnippet":"// Equivalente en Java usando extends y super(...)","consoleOutput":"Depósito exitoso en AH-101. Saldo: $1200\nDepósito exitoso en AH-101. Saldo: $1260\n🎉 Interés acreditado: +$60","stepByStepExplanation":["CuentaAhorro heredó la propiedad Saldo y el método Depositar sin escribir una sola línea duplicada.","Agregó su propia propiedad TasaInteres y su método AplicarInteres."]}},"speakerNotes":"Mostrar cómo CuentaAhorro puede llamar a Depositar(...) internamente desde AplicarInteres()."},{"id":"c3-s8","slideNumber":8,"type":"common_mistakes","title":"Errores Típicos: La Herencia Forzada que Rompe la Lógica","subtitle":"El error de usar herencia solo por pereza en vez de relación conceptual genuina","badge":"Antipatrón de Diseño","content":{"commonMistakes":[{"wrongCode":"// ❌ ANTIPATRÓN: \"HERENCIA FORZADA\"\npublic class Cuadrado : Rectangulo { ... }\n// Un cuadrado viola el comportamiento del rectángulo si cambias alto y ancho por separado.","wrongExplanation":"No uses herencia solo para ahorrarte escribir 3 variables. Debe existir una relación genuina \"Es-Un\". Si la relación es \"Tiene-Un\", debes usar composición.","rightCode":"// ✅ PRINCIPIO LISKOV (LSP)\n// Si Auto \"TIENE UN\" Motor, no hagas \"class Auto : Motor\".\n// Haz:\npublic class Auto {\n    private Motor _motor; // Composición\n}","rightExplanation":"Pregúntate siempre: \"¿B es realmente un A en el mundo real, o B solo CONTIENE a un A?\". Un auto TIENE un motor, no ES       } else if (slide.type === 'weekly_activity_bridge' && slide.content.activityBridge) {
        const ab = slide.content.activityBridge;
        inner += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">';
        inner += '  <div class="p-4 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-black text-[10px] uppercase">Actividad 1: Básica</span><h4 class="font-bold text-white">' + ab.act1Title + '</h4><p class="text-slate-400">' + ab.act1Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-blue-500/30 bg-blue-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-black text-[10px] uppercase">Actividad 2: Intermedia</span><h4 class="font-bold text-white">' + ab.act2Title + '</h4><p class="text-slate-400">' + ab.act2Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-purple-500/30 bg-purple-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-black text-[10px] uppercase">Actividad 3: Entregable</span><h4 class="font-bold text-white">' + ab.act3Title + '</h4><p class="text-slate-400">' + ab.act3Desc + '</p></div>';
        inner += '</div>';
      }

      card.innerHTML = inner;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = slides.length - 1;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function selectAnatomy(idx) {
      selectedAnatomyIndex = idx;
      renderSlide();
    }

    function selectTopic(idx) {
      selectedTopicIndex = idx;
      renderSlide();
    }

    function toggleTopicGrid() {
      showAllTopicsGrid = !showAllTopicsGrid;
      renderSlide();
    }

    function toggleLang() {
      currentLang = currentLang === 'csharp' ? 'java' : 'csharp';
      const btn = document.getElementById('btn-lang');
      btn.textContent = currentLang === 'csharp' ? 'C# .NET' : 'Java 17';
      btn.className = currentLang === 'csharp'
        ? 'px-2.5 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold transition-all'
        : 'px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 text-xs font-black transition-all';
      renderSlide();
    }

    function toggleTheme() {
      isDark = !isDark;
      document.body.className = isDark
        ? 'bg-slate-950 text-slate-100 min-h-screen flex flex-col'
        : 'bg-slate-100 text-slate-900 min-h-screen flex flex-col';
      const card = document.getElementById('slide-card');
      if (card) {
        card.className = isDark
          ? 'bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl min-h-[580px] flex flex-col justify-between transition-all'
          : 'bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-xl min-h-[580px] flex flex-col justify-between transition-all';
      }
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    renderSlide();
  </script>
</body>
</html>
