  <script>
    const slides = [{"id":"c1-s1","slideNumber":1,"type":"cover","title":"Programación Orientada a Objetos: La Revolución de los Moldes y Entidades","subtitle":"De instrucciones secuenciales rígidas a sistemas modulares autónomos que modelan la realidad","badge":"Sesión Inaugural · Semana 1","content":{"leadText":"Bienvenido al paradigma que mueve el software empresarial moderno en C# .NET y Java.","bulletPoints":[{"icon":"🎯","title":"Meta de la Sesión","desc":"Comprender por qué la POO reemplazó a la programación estructurada en proyectos que superan las mil líneas de código."},{"icon":"💡","title":"Idea Fuerza","desc":"Una clase es un plano arquitectónico; el objeto es la casa construida donde sí puedes vivir."},{"icon":"⚙️","title":"Tecnologías del Curso","desc":"Ecosistema dual: C# (.NET 8 LTS) y Java (JDK 17/21 LTS)."}]},"speakerNotes":"Dar la bienvenida al grupo. Preguntar si alguien ha programado antes en C o Python básico y explicar que hoy cambiarán su forma de pensar de \"verbos y pasos\" a \"sustantivos con responsabilidades\"."},{"id":"c1-s2","slideNumber":2,"type":"real_world_analogy","title":"El Problema del Mundo Real: El Restaurante Desorganizado","subtitle":"¿Por qué la programación estructurada colapsa cuando el software crece?","badge":"Analogía Cotidiana","content":{"imageUrl":"/src/assets/images/blueprint_to_object_1791519156413.jpg","imageCaption":"El plano arquitectónico (Clase) define las medidas; la casa construida (Objeto) es la entidad viva en el mundo real.","analogyBox":{"title":"La Cocina Tradicional vs. El Restaurante con Especialistas","analogy":"En una cocina estructurada antigua, un solo cocinero tiene una lista de 200 pasos gigantescos. Si un ingrediente se mueve, toda la receta se arruina. En un restaurante POO, tienes especialistas autónomos: el Mesero atiende mesas, el Chef prepara comida, la Nevera guarda alimentos y el Cajero cobra. Cada uno protege sus propios datos y se comunican enviándose mensajes.","moral":"La POO no se trata de escribir más código, sino de encapsular responsabilidades para que el cambio de una parte no destruya el resto."}},"speakerNotes":"Dedicar 5 minutos a la analogía. Enfatizar que en el código estructurado una variable global modificada por error provoca fallos catastróficos difíciles de rastrear."},{"id":"c1-s3","slideNumber":3,"type":"topic_breakdown","title":"Módulo Temático 1: Aspectos Conceptuales (U1.1 a U1.6)","subtitle":"Qué significa cada concepto del temario oficial, cómo se utiliza y cómo se aplica","badge":"Temario Oficial · Unidad 1","content":{"topicBreakdown":{"unitCode":"U1","unitTitle":"Aspectos Conceptuales del Modelo Orientado a Objetos","summary":"Los 6 fundamentos teóricos y epistemológicos que definen el paradigma orientado a objetos frente al estructurado tradicional.","topics":[{"code":"U1.1","title":"Objetos y Clases","keyBadge":"Fundamento Central","whatItMeans":"Una clase es el plano arquitectónico o molde que describe qué datos y funciones tendrá algo. El objeto es la entidad real y viva que se crea en la memoria de la computadora siguiendo ese molde.","howToUse":"Se define la clase una sola vez usando la palabra reservada \"class\". Luego se crean tantos objetos como se necesiten mediante el operador \"new\", el cual reserva memoria en el Heap.","appliedExample":{"scenario":"Catálogo de una tienda de autos","csharpCode":"// C# .NET\nAuto miAuto = new Auto(\"Toyota\", 2024);\nmiAuto.Encender();","javaCode":"// Java 17+\nAuto miAuto = new Auto(\"Toyota\", 2024);\nmiAuto.encender();","visualAnalogyOrDiagram":"Plano en papel (Clase) ──[new]──> Auto físico rodando en la calle (Objeto)"}},{"code":"U1.2","title":"Mensajes entre Objetos","keyBadge":"Comunicación","whatItMeans":"En lugar de que una función gigante lo haga todo, los objetos cooperan comunicándose entre sí. Enviar un mensaje significa pedirle a otro objeto que ejecute una de sus acciones pasándole los datos necesarios.","howToUse":"Se utiliza el operador punto (.) sobre la variable del objeto destinatario: receptor.metodo(argumentos). El receptor decide autónomamente cómo responder según su lógica interna.","appliedExample":{"scenario":"Transferencia bancaria entre dos cuentas","csharpCode":"// C# .NET\ncuentaOrigen.Transferir(cuentaDestino, 500.00);","javaCode":"// Java 17+\ncuentaOrigen.transferir(cuentaDestino, 500.00);","visualAnalogyOrDiagram":"[Emisor: Cajero] ──(mensaje: depositar $500)──> [Receptor: CuentaBancaria]"}},{"code":"U1.3","title":"Encapsulamiento","keyBadge":"Seguridad de Datos","whatItMeans":"Es el principio de blindar los datos internos de un objeto para que nadie desde afuera pueda modificarlos directamente ni dejarlos en un estado corrupto (como poner una edad negativa o saldo falso).","howToUse":"Declara los atributos como \"private\" y ofrece métodos públicos (\"get\" para leer y \"set\" con validaciones lógicas para modificar).","appliedExample":{"scenario":"Cajero automático protegiendo el saldo","csharpCode":"// C# .NET\nprivate double saldo;\npublic void Depositar(double monto) {\n    if (monto > 0) saldo += monto;\n}","javaCode":"// Java 17+\nprivate double saldo;\npublic void depositar(double monto) {\n    if (monto > 0) this.saldo += monto;\n}","visualAnalogyOrDiagram":"Cápsula médica sellada: solo interactúas con su superficie, el interior está protegido."}},{"code":"U1.4","title":"Composición, Herencia y Delegación","keyBadge":"Relaciones de Diseño","whatItMeans":"Son las tres formas en que las clases se relacionan: Composición es \"tiene un\" (un Auto tiene un Motor); Herencia es \"es un\" (un Taxi es un Vehículo); Delegación es pedirle a un especialista que haga una tarea.","howToUse":"Prefiere Composición cuando un objeto contiene a otro como pieza fundamental. Usa Herencia solo cuando existe una relación jerárquica natural y verdadera.","appliedExample":{"scenario":"Computadora armada con sus partes","csharpCode":"// C# .NET (Composición: Laptop \"tiene un\" Procesador)\npublic class Laptop {\n    private Procesador cpu = new Procesador();\n}","javaCode":"// Java 17+ (Composición)\npublic class Laptop {\n    private Procesador cpu = new Procesador();\n}","visualAnalogyOrDiagram":"Auto (Contenedor) ──contiene──> Motor (Pieza interna indivisible)"}},{"code":"U1.5","title":"Polimorfismo (Introducción)","keyBadge":"Muchas Formas","whatItMeans":"Permite enviar exactamente la misma orden (\"pagar\", \"dibujar\", \"calcular\") a objetos distintos, y que cada uno responda a su propia manera según su naturaleza sin que el emisor deba preocuparse por los detalles.","howToUse":"Se define un método común en una clase base o interfaz, y cada clase hija lo sobrescribe (override en C#, @Override en Java).","appliedExample":{"scenario":"Botón de reproducción multimedia","csharpCode":"// C# .NET\nIReproductor r1 = new ReproductorVideo();\nIReproductor r2 = new ReproductorAudio();\nr1.Play(); // Abre pantalla\nr2.Play(); // Solo sonido","javaCode":"// Java 17+\nReproductor r1 = new ReproductorVideo();\nReproductor r2 = new ReproductorAudio();\nr1.play();\nr2.play();","visualAnalogyOrDiagram":"Control remoto universal: el botón \"Power\" enciende tanto una TV como un aire acondicionado."}},{"code":"U1.6","title":"Recursividad","keyBadge":"Algoritmo Recursivo","whatItMeans":"Es una técnica donde una función o método se llama a sí mismo para resolver un problema grande dividiéndolo en versiones cada vez más pequeñas, hasta llegar a un caso base evidente que detiene el proceso.","howToUse":"Requiere obligatoriamente dos partes: 1) Condición de parada (caso base) para evitar agotar la memoria de la pila (StackOverflow), y 2) Llamada recursiva con datos que se acerquen al caso base.","appliedExample":{"scenario":"Cálculo de factorial o explorador de carpetas","csharpCode":"// C# .NET\npublic int Factorial(int n) {\n    if (n <= 1) return 1; // Caso base\n    return n * Factorial(n - 1); // Paso recursivo\n}","javaCode":"// Java 17+\npublic int factorial(int n) {\n    if (n <= 1) return 1;\n    return n * factorial(n - 1);\n}","visualAnalogyOrDiagram":"Muñecas rusas (Matrioskas): abres una para encontrar una versión más pequeña hasta la última sólida."}}]}},"speakerNotes":"Recorrer cada tema de la Unidad 1 explicando qué significa y cómo se aplica en la vida real. Enfatizar la diferencia entre molde y objeto."},{"id":"c1-s4","slideNumber":4,"type":"topic_breakdown","title":"Módulo Temático 2: Clases, Objetos y Estructura (U2.1 a U2.8)","subtitle":"Sintaxis técnica de la clase, métodos constructores, paquetes, modificadores y clases abstractas","badge":"Temario Oficial · Unidad 2","content":{"topicBreakdown":{"unitCode":"U2","unitTitle":"Clases y Objetos: Anatomía y Componentes Técnicos","summary":"Los 8 componentes estructurales indispensables para codificar clases profesionales en Java y C#.","topics":[{"code":"U2.1","title":"Definición de Clase y Objetos","keyBadge":"Sintaxis de Clase","whatItMeans":"Es la estructura formal en código para declarar un nuevo tipo de dato propio que agrupa atributos y métodos.","howToUse":"Se escribe \"public class NombreClase { ... }\" en un archivo con el mismo nombre. Por convención mundial se usa PascalCase (primer letra mayúscula).","appliedExample":{"scenario":"Modelado del alumno en sistema escolar","csharpCode":"// C# .NET\npublic class Estudiante {\n    public string Matricula { get; set; }\n    public string Nombre { get; set; }\n}","javaCode":"// Java 17+\npublic class Estudiante {\n    private String matricula;\n    private String nombre;\n}","visualAnalogyOrDiagram":"Archivo de texto con reglas -> Compilador genera tipo de dato utilizable"}},{"code":"U2.2","title":"Métodos Básicos","keyBadge":"Comportamiento","whatItMeans":"Son las acciones o verbos que una clase sabe ejecutar. Pueden recibir parámetros para trabajar y pueden devolver un resultado o no devolver nada (void).","howToUse":"Se declaran con su modificador de acceso, tipo de retorno, nombre, paréntesis para parámetros y llaves { } para su cuerpo de instrucciones.","appliedExample":{"scenario":"Cálculo de impuestos de un producto","csharpCode":"// C# .NET\npublic double CalcularIva(double porcentaje) {\n    return this.precio * (porcentaje / 100.0);\n}","javaCode":"// Java 17+\npublic double calcularIva(double porcentaje) {\n    return this.precio * (porcentaje / 100.0);\n}","visualAnalogyOrDiagram":"Entrada: [Parámetros] ──> [Método Procesador] ──> Salida: [Valor de retorno]"}},{"code":"U2.3","title":"Constructores y Sobrecarga","keyBadge":"Inicialización","whatItMeans":"Es un método especial que se ejecuta automáticamente en el momento exacto en que un objeto nace con \"new\". Su objetivo es dejar al objeto listo y con valores válidos desde el primer segundo.","howToUse":"Lleva el mismo nombre exacto de la clase y no tiene tipo de retorno (ni siquiera void). Puede haber varios constructores con diferentes parámetros (sobrecarga).","appliedExample":{"scenario":"Crear usuario con o sin teléfono","csharpCode":"// C# .NET (Sobrecarga de constructores)\npublic Usuario(string email) { Email = email; }\npublic Usuario(string email, string tel) : this(email) { Telefono = tel; }","javaCode":"// Java 17+\npublic Usuario(String email) { this.email = email; }\npublic Usuario(String email, String tel) {\n    this(email); this.telefono = tel;\n}","visualAnalogyOrDiagram":"Acta de nacimiento oficial: rellena los datos iniciales indispensables del recién nacido."}},{"code":"U2.4","title":"Getters y Setters (Propiedades)","keyBadge":"Acceso Controlado","whatItMeans":"Son los guardianes de los atributos privados. El Getter permite leer el valor, y el Setter permite cambiarlo validando que el nuevo valor cumpla las reglas del negocio.","howToUse":"En Java se escriben como métodos getCampo() y setCampo(valor). En C# se utilizan las propiedades elegantes { get; set; } que simplifican la sintaxis.","appliedExample":{"scenario":"Validación de calificación de 0 a 100","csharpCode":"// C# .NET\nprivate int calif;\npublic int Calificacion {\n    get => calif;\n    set => calif = (value >= 0 && value <= 100) ? value : 0;\n}","javaCode":"// Java 17+\npublic void setCalificacion(int c) {\n    if (c >= 0 && c <= 100) this.calificacion = c;\n}","visualAnalogyOrDiagram":"Ventanilla bancaria: no entras a la bóveda, le pides al cajero que deposite o consulte."}},{"code":"U2.5","title":"Método Main y Punto de Entrada","keyBadge":"Punto de Inicio","whatItMeans":"Es la puerta principal por donde el sistema operativo y la máquina virtual inician la ejecución de todo el programa.","howToUse":"En Java: public static void main(String[] args). En C#: static void Main(string[] args) o el formato moderno de Top-Level Statements en Program.cs.","appliedExample":{"scenario":"Arranque de la aplicación de consola","csharpCode":"// C# .NET\npublic class Program {\n    public static void Main(string[] args) {\n        Console.WriteLine(\"Iniciando sistema...\");\n    }\n}","javaCode":"// Java 17+\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Iniciando sistema...\");\n    }\n}","visualAnalogyOrDiagram":"Llave de encendido del motor: sin el Main, las clases existen pero nadie las echa a andar."}},{"code":"U2.6","title":"Sentencia package","keyBadge":"Organización Java","whatItMeans":"Permite organizar cientos de clases en carpetas lógicas y espacios de trabajo para evitar que dos clases con el mismo nombre choquen entre sí.","howToUse":"Debe ser obligatoriamente la primera línea de código del archivo en Java (ej. package com.unidep.modelo;). En C# su equivalente es \"namespace\".","appliedExample":{"scenario":"Estructuración modular de un proyecto","csharpCode":"// C# .NET (Namespace)\nnamespace Unidep.Logistica.Modelos;\npublic class Camion { }","javaCode":"// Java 17+ (Package)\npackage com.unidep.logistica.modelos;\npublic class Camion { }","visualAnalogyOrDiagram":"Carpetas del archivador: separa \"Facturas\", \"Clientes\" y \"Reportes\" para no revolver papeles."}},{"code":"U2.7","title":"Sentencia import","keyBadge":"Reutilización de Librerías","whatItMeans":"Le indica al compilador qué clases de otros paquetes o librerías externas queremos usar en nuestro archivo actual.","howToUse":"En Java: import java.util.ArrayList;. En C#: using System.Collections.Generic;. Evita tener que escribir la ruta completa del paquete cada vez que usamos la clase.","appliedExample":{"scenario":"Uso de listas y utilerías estándar","csharpCode":"// C# .NET\nusing System.Collections.Generic;\nList<string> nombres = new();","javaCode":"// Java 17+\nimport java.util.ArrayList;\nArrayList<String> nombres = new ArrayList<>();","visualAnalogyOrDiagram":"Índice de la biblioteca: marcas la página de referencia para no buscar el libro desde cero."}},{"code":"U2.8","title":"Clases Abstractas","keyBadge":"Contratos Base","whatItMeans":"Es una clase incompleta a propósito que sirve como plantilla base para otras clases hijas. No se puede crear un objeto directamente de ella con \"new\", porque representa una idea general, no algo específico.","howToUse":"Se declara con la palabra clave \"abstract\". Puede tener métodos ya programados y métodos abstractos (sin cuerpo) que las clases hijas están obligadas a programar.","appliedExample":{"scenario":"Clase base Figura que exige calcular área","csharpCode":"// C# .NET\npublic abstract class Figura {\n    public abstract double CalcularArea();\n}","javaCode":"// Java 17+\npublic abstract class Figura {\n    public abstract double calcularArea();\n}","visualAnalogyOrDiagram":"Concepto \"Vehículo\": no puedes comprar un \"Vehículo\" genérico, compras un Taxi o un Autobús."}}]}},"speakerNotes":"Explicar los 8 componentes de la Unidad 2: desde la definición de clase hasta las clases abstractas y sentencias package/import."},{"id":"c1-s5","slideNumber":5,"type":"core_concept_dual","title":"Concepto Clave: Estructura Mínima de una Clase en C# y Java","subtitle":"Atributos (lo que el objeto sabe) y Métodos (lo que el objeto sabe hacer)","badge":"Comparativa de Lenguajes","content":{"codeComparison":{"concept":"Definición de la Clase Alumno con atributos y método de saludo","csharpCode":"// C# .NET 8\npublic class Alumno\n{\n    // Atributos (Estado)\n    public string Nombre { get; set; }\n    public int Edad { get; set; }\n\n    // Método (Comportamiento)\n    public void Saludar()\n    {\n        Console.WriteLine($\"Hola, soy {Nombre} y tengo {Edad} años.\");\n    }\n}","javaCode":"// Java JDK 17+\npublic class Alumno {\n    // Atributos (Estado)\n    private String nombre;\n    private int edad;\n\n    // Método (Comportamiento)\n    public void saludar() {\n        System.out.println(\"Hola, soy \" + nombre + \" y tengo \" + edad + \" años.\");\n    }\n}","explanation":"Observa la asombrosa similitud: ambos lenguajes agrupan datos (Nombre, Edad) con las funciones que operan sobre ellos (Saludar). En C# se acostumbra PascalCase para métodos, en Java camelCase."}},"speakerNotes":"Mostrar el código en proyector. Resaltar que en C# usamos Console.WriteLine y en Java System.out.println, pero la lógica mental es exactamente idéntica."},{"id":"c1-s6","slideNumber":6,"type":"instruction_anatomy","title":"Anatomía de la Instrucción: Creación de un Objeto Paso a Paso","subtitle":"Desglose detallado de cada palabra para entender qué ocurre en la computadora","badge":"⭐ Anatomía Visual de la Instrucción","content":{"instructionAnatomy":{"instructionStatement":"Alumno miAlumno = new Alumno(\"Carlos\", 20);","statementContext":"Esta línea sencilla es la puerta de entrada a la POO. Cada una de sus 6 partes cumple un rol vital en el procesador y la memoria RAM.","parts":[{"token":"Alumno","name":"1. Tipo / Clase Molde","role":"Indica al compilador qué molde o plano arquitectónico define las reglas de este objeto.","everydayAnalogy":"Es la receta o el formato en blanco de una credencial de estudiante.","color":"purple"},{"token":"miAlumno","name":"2. Variable Referencia","role":"Es el nombre o control remoto en la memoria Stack que usaremos para comunicarnos con el objeto.","everydayAnalogy":"Es la correa con la que sostienes a tu perro, o el control remoto de tu televisor.","color":"blue"},{"token":"=","name":"3. Operador Asignación","role":"Conecta el control remoto (Stack) con el objeto real que nacerá en la memoria (Heap).","everydayAnalogy":"Es el cable que enchufa la lámpara a la toma de corriente.","color":"amber"},{"token":"new","name":"4. Operador de Nacimiento","role":"Orden mágica al sistema operativo: \"¡Reserva memoria física real en el Heap para crear un nuevo ser vivo digital!\".","everydayAnalogy":"Es el sello de construcción que autoriza edificar la casa sobre el terreno.","color":"emerald"},{"token":"Alumno(\"Carlos\", 20)","name":"5. Llamada al Constructor","role":"Método especial que se ejecuta en el instante exacto del nacimiento para darle sus datos iniciales.","everydayAnalogy":"El acta de nacimiento donde se escribe el nombre y la edad del recién nacido.","color":"rose"},{"token":";","name":"6. Fin de Sentencia","role":"Indica al compilador que la orden ha terminado y puede procesar la siguiente instrucción.","everydayAnalogy":"El punto final en una oración gramatical en español.","color":"cyan"}],"takeaway":"Sin el operador \"new\", la variable es un control remoto apagado apuntando a la nada (null). \"new\" es el nacimiento físico del objeto."}},"speakerNotes":"Hacer que los alumnos repitan las 5 partes: Tipo, Referencia, Asignación, Instanciación (new) y Constructor. Esto despeja el 80% de las confusiones en el examen."},{"id":"c1-s7","slideNumber":7,"type":"simple_example","title":"Ejemplo Ultra-Sencillo de la Vida Real: Simulador de Mascotas","subtitle":"Código completo en C# de 15 líneas para entender clases, atributos y métodos","badge":"Código Práctico en Aula","content":{"simpleExample":{"domainScenario":"Crear una clase Perro, instanciar dos perros diferentes (Firulais y Rex) y hacerlos ladrar de forma independiente.","csharpSnippet":"using System;\n\n// 1. Molde o Clase\npublic class Perro\n{\n    public string Nombre;\n    public int Energia;\n\n    public void Ladrar()\n    {\n        Console.WriteLine($\"{Nombre} dice: ¡Guau guau! (Energía restante: {Energia})\");\n    }\n}\n\n// 2. Punto de Entrada\nclass Program\n{\n    static void Main()\n    {\n        // Instancia 1\n        Perro perro1 = new Perro();\n        perro1.Nombre = \"Firulais\";\n        perro1.Energia = 100;\n\n        // Instancia 2\n        Perro perro2 = new Perro();\n        perro2.Nombre = \"Rex\";\n        perro2.Energia = 75;\n\n        // Ambos responden autónomamente\n        perro1.Ladrar();\n        perro2.Ladrar();\n    }\n}","javaSnippet":"public class Perro {\n    String nombre;\n    int energia;\n\n    void ladrar() {\n        System.out.println(nombre + \" dice: ¡Guau guau! (Energía: \" + energia + \")\");\n    }\n\n    public static void main(String[] args) {\n        Perro perro1 = new Perro();\n        perro1.nombre = \"Firulais\";\n        perro1.energia = 100;\n\n        Perro perro2 = new Perro();\n        perro2.nombre = \"Rex\";\n        perro2.energia = 75;\n\n        perro1.ladrar();\n        perro2.ladrar();\n    }\n}","consoleOutput":"Firulais dice: ¡Guau guau! (Energía restante: 100)\nRex dice: ¡Guau guau! (Energía restante: 75)","stepByStepExplanation":["Se define la clase \"Perro\" con 2 variables (Nombre, Energia) y una acción (Ladrar).","En el Main, se usan dos instrucciones \"new Perro()\" para crear dos objetos separados en memoria.","Modificar la energía de Rex no afecta en absoluto a Firulais; cada objeto tiene su propia memoria privada."]}},"speakerNotes":"Pedir a los alumnos que abran su terminal o Visual Studio / VS Code y ejecuten este código. Comprobar que todos vean la salida en consola."},{"id":"c1-s8","slideNumber":8,"type":"common_mistakes","title":"Trampas Comunes de Principiantes: El Error del Puntero Nulo","subtitle":"El fallo más común en el primer mes         ex.stepByStepExplanation.forEach(st => {
          inner += '        <div class="text-xs text-slate-300 flex items-start gap-1.5"><span>✓</span><span>' + st + '</span></div>';
        });
        inner += '      </div>';
        inner += '    </div>';
        inner += '  </div>';
        inner += '</div>';
      } else if (slide.type === 'common_mistakes' && slide.content.commonMistakes) {
        inner += '<div class="space-y-4">';
        slide.content.commonMistakes.forEach(cm => {
          inner += '  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">';
          inner += '    <div class="p-4 rounded-2xl border border-rose-500/30 bg-rose-950/20 space-y-2">';
          inner += '      <strong class="text-rose-400 block">❌ Error Típico:</strong>';
          inner += '      <pre class="font-mono text-[11px] bg-black p-2 rounded text-rose-300">' + escapeHtml(cm.wrongCode) + '</pre>';
          inner += '      <p class="text-rose-200">' + cm.wrongExplanation + '</p>';
          inner += '    </div>';
          inner += '    <div class="p-4 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 space-y-2">';
          inner += '      <strong class="text-emerald-400 block">✅ Forma Correcta:</strong>';
          inner += '      <pre class="font-mono text-[11px] bg-black p-2 rounded text-emerald-300">' + escapeHtml(cm.rightCode) + '</pre>';
          inner += '      <p class="text-emerald-200">' + cm.rightExplanation + '</p>';
          inner += '    </div>';
          inner += '  </div>';
          inner += '  <div class="p-2.5 rounded-xl border border-amber-500/30 bg-amber-950/20 text-xs text-amber-300 text-center font-bold">⭐ Regla de Oro: ' + cm.ruleOfThumb + '</div>';
        });
        inner += '</div>';
      } else if (slide.type === 'classroom_challenge' && slide.content.challenge) {
        const ch = slide.content.challenge;
        inner += '<div class="space-y-4 max-w-xl mx-auto text-center">';
        inner += '  <span class="px-3 py-1 rounded-full bg-amber-500/20 border border-amber-500/30 text-amber-300 font-bold text-xs">⏱️ Tiempo: ' + ch.timeMinutes + ' minutos</span>';
        inner += '  <div class="p-6 rounded-2xl border border-slate-800 bg-black space-y-2">';
        inner += '    <h3 class="text-xl font-bold text-white">' + ch.question + '</h3>';
        inner += '    <p class="text-xs text-slate-300">' + ch.instructions + '</p>';
        inner += '  </div>';
        inner += '  <div class="p-4 rounded-xl border border-emerald-500/30 bg-emerald-950/20 text-xs text-emerald-300 text-left"><strong>✓ Respuesta Sugerida:</strong><p class="mt-1">' + ch.expectedAnswer + '</p></div>';
        inner += '</div>';
      } else if (slide.type === 'weekly_activity_bridge' && slide.content.activityBridge) {
        const ab = slide.content.activityBridge;
        inner += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">';
        inner += '  <div class="p-4 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-black text-[10px] uppercase">Actividad 1: Básica</span><h4 class="font-bold text-white">' + ab.act1Title + '</h4><p class="text-slate-400">' + ab.act1Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-blue-500/30 bg-blue-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-black text-[10px] uppercase">Actividad 2: Intermedia</span><h4 class="font-bold text-white">' + ab.act2Title + '</h4><p class="text-slate-400">' + ab.act2Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-purple-500/30 bg-purple-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-black text-[10px] uppercase">Actividad 3: Entregable</span><h4 class="font-bold text-white">' + ab.act3Title + '</h4><p class="text-slate-400">' + ab.act3Desc + '</p></div>';
        inner += '</div>';
      }

      card.innerHTML = inner;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = slides.length - 1;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function selectAnatomy(idx) {
      selectedAnatomyIndex = idx;
      renderSlide();
    }

    function selectTopic(idx) {
      selectedTopicIndex = idx;
      renderSlide();
    }

    function toggleTopicGrid() {
      showAllTopicsGrid = !showAllTopicsGrid;
      renderSlide();
    }

    function toggleLang() {
      currentLang = currentLang === 'csharp' ? 'java' : 'csharp';
      const btn = document.getElementById('btn-lang');
      btn.textContent = currentLang === 'csharp' ? 'C# .NET' : 'Java 17';
      btn.className = currentLang === 'csharp'
        ? 'px-2.5 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold transition-all'
        : 'px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 text-xs font-black transition-all';
      renderSlide();
    }

    function toggleTheme() {
      isDark = !isDark;
      document.body.className = isDark
        ? 'bg-slate-950 text-slate-100 min-h-screen flex flex-col'
        : 'bg-slate-100 text-slate-900 min-h-screen flex flex-col';
      const card = document.getElementById('slide-card');
      if (card) {
        card.className = isDark
          ? 'bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl min-h-[580px] flex flex-col justify-between transition-all'
          : 'bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-xl min-h-[580px] flex flex-col justify-between transition-all';
      }
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    renderSlide();
  </script>
</body>
</html>
