  <script>
    const slides = [{"id":"c4-s1","slideNumber":1,"type":"cover","title":"Polimorfismo e Interfaces: Muchas Formas, Un Solo Mensaje","subtitle":"El pilar supremo de la arquitectura de software flexible y desacoplada","badge":"Semana 4 · Cátedra Oficial","content":{"leadText":"El polimorfismo permite que una misma orden (\"Dibujar\" o \"Cobrar\") sea ejecutada de formas totalmente distintas según el objeto que la reciba.","bulletPoints":[{"icon":"🎭","title":"Muchas Formas (Poli-Morfismo)","desc":"Una lista de Figuras puede contener Círculos, Rectángulos y Triángulos. Con un solo \"foreach\", cada uno se dibuja a su manera."},{"icon":"📜","title":"Interfaces como Contratos","desc":"La interfaz \"IPagable\" o \"IImprimible\" define QUÉ debe hacerse, no CÓMO."},{"icon":"🧩","title":"Clases Abstractas","desc":"Clases incompletas a propósito que obligan a sus hijos a definir los detalles."}]},"speakerNotes":"Hacer la metáfora del botón de Play en un control remoto: enciende un reproductor de CD, un streaming de Netflix o un cassette. El botón es el mismo, el comportamiento cambia."},{"id":"c4-s2","slideNumber":2,"type":"real_world_analogy","title":"El Problema del Mundo Real: El Enchufe Eléctrico Universal","subtitle":"¿Qué pasaría si tu cargador de celular solo funcionara con una pared específica?","badge":"Analogía Cotidiana","content":{"imageUrl":"/src/assets/images/polymorphism_usb_plug_1791519703357.jpg","imageCaption":"Una sola toma o interfaz estándar universal energiza lámparas, tostadoras o laptops (polimorfismo)","analogyBox":{"title":"El Conector USB y la Toma de Corriente de Pared","analogy":"La toma de corriente en la pared de tu casa no sabe si vas a conectar una tostadora, un refrigerador, una lámpara o tu laptop. La pared solo define un contrato universal: \"Si tienes dos clavijas y toleras 120V, te doy energía\". Cada aparato aprovecha la electricidad para algo totalmente diferente (uno calienta pan, el otro enfría agua).","moral":"Eso es una Interfaz: un contrato ciego que permite que componentes totalmente diferentes se conecten sin conocerse por dentro."}},"speakerNotes":"Preguntar: \"¿Qué es más fácil, cambiar la pared entera o cambiar el cable que conectas?\". La interfaz permite cambiar componentes sin romper el sistema."},{"id":"c4-s3","slideNumber":3,"type":"topic_breakdown","title":"Módulo Temático 7: Herencia, Interfaces y Polimorfismo (U7.1 a U7.8)","subtitle":"Jerarquías, super/base, clases sealed/final, interfaces, encapsulación protected y ligadura dinámica","badge":"Temario Oficial · Unidad 7","content":{"topicBreakdown":{"unitCode":"U7","unitTitle":"Herencia, Contratos de Interfaz y Polimorfismo Dinámico","summary":"Los 8 pilares del diseño jerárquico profesional: reutilización sin duplicación, contratos abstractos y despacho dinámico en tiempo de ejecución.","topics":[{"code":"U7.1","title":"Definición de Herencia","keyBadge":"Principio DRY","whatItMeans":"Permite que una nueva clase (hija) herede todos los atributos y métodos de una clase ya existente (padre), evitando duplicar código y modelando la relación \"es un\".","howToUse":"En C# se usa dos puntos (:) ej. public class Taxi : Vehiculo. En Java se usa \"extends\" ej. public class Taxi extends Vehiculo.","appliedExample":{"scenario":"Camión heredando de Vehículo comercial","csharpCode":"// C# .NET\npublic class Camion : Vehiculo {\n    public double CapacidadToneladas { get; set; }\n}","javaCode":"// Java 17+\npublic class Camion extends Vehiculo {\n    private double capacidadToneladas;\n}","visualAnalogyOrDiagram":"Árbol genealógico: el hijo hereda los apellidos y rasgos genéticos de los padres."}},{"code":"U7.2","title":"Creación de Nuevas Clases Derivadas","keyBadge":"Especialización","whatItMeans":"Es el proceso de tomar una clase general y especializarla añadiendo nuevos atributos o métodos específicos que solo la clase hija tiene.","howToUse":"La clase hija solo agrega lo que la distingue. No vuelve a declarar los atributos que ya existen en la clase padre.","appliedExample":{"scenario":"Cuenta de ahorros agregando tasa de interés","csharpCode":"// C# .NET\npublic class CuentaAhorro : CuentaBancaria {\n    public double TasaInteres { get; set; }\n    public void AplicarInteresMensual() { Saldo += Saldo * TasaInteres; }\n}","javaCode":"// Java 17+\npublic class CuentaAhorro extends CuentaBancaria {\n    private double tasaInteres;\n}","visualAnalogyOrDiagram":"Teléfono estándar -> Teléfono Inteligente (Smartphone añade pantalla táctil y GPS)."}},{"code":"U7.3","title":"Jerarquías de Herencia","keyBadge":"Árbol de Tipos","whatItMeans":"Es la estructura en árbol donde una superclase padre puede tener múltiples hijas, y esas hijas a su vez pueden ser padres de subclases más específicas.","howToUse":"En Java y C# no existe herencia múltiple de clases (una clase solo puede tener un padre directo). Toda clase sin padre hereda automáticamente de la clase raíz Object.","appliedExample":{"scenario":"Jerarquía: Empleado -> EmpleadoVentas -> GerenteVentas","csharpCode":"// C# .NET\npublic class Empleado { }\npublic class Vendedor : Empleado { }\npublic class Gerente : Vendedor { }","javaCode":"// Java 17+\npublic class Empleado { }\npublic class Vendedor extends Empleado { }\npublic class Gerente extends Vendedor { }","visualAnalogyOrDiagram":"Clasificación biológica: Ser Vivo -> Mamífero -> Canino -> Lobo."}},{"code":"U7.4","title":"Referencia super (Java) y base (C#)","keyBadge":"Invocación del Padre","whatItMeans":"Es la palabra clave para referirse directamente a la clase padre. Permite llamar al constructor del padre para inicializar sus datos y reusar sus métodos originales.","howToUse":"En Java: super(argumentos); debe ser la primera línea del constructor de la hija. En C#: : base(argumentos) se escribe en la cabecera del constructor.","appliedExample":{"scenario":"Inicialización de nombre y matrícula en la clase padre","csharpCode":"// C# .NET\npublic class AlumnoBecado : Alumno {\n    public double Beca { get; set; }\n    public AlumnoBecado(string nom, double b) : base(nom) {\n        Beca = b;\n    }\n}","javaCode":"// Java 17+\npublic class AlumnoBecado extends Alumno {\n    public AlumnoBecado(String nom, double b) {\n        super(nom); // Llama al constructor de Alumno\n        this.beca = b;\n    }\n}","visualAnalogyOrDiagram":"Llamar a tu padre para que él firme los documentos generales antes de que tú elijas los detalles."}},{"code":"U7.5","title":"Clases y Métodos final (Java) / sealed (C#)","keyBadge":"Clases Selladas","whatItMeans":"Sirve para prohibir que una clase sea heredada o que un método sea sobrescrito, garantizando que nadie pueda alterar su comportamiento por seguridad o diseño.","howToUse":"En Java se usa la palabra clave \"final\" (ej. public final class Seguridad). En C# se usa \"sealed\" (ej. public sealed class Seguridad).","appliedExample":{"scenario":"Clase crítica de encriptación o autenticación","csharpCode":"// C# .NET (No permite que nadie la herede)\npublic sealed class ValidadorSeguro {\n    public bool ValidarToken(string token) => true;\n}","javaCode":"// Java 17+\npublic final class ValidadorSeguro {\n    public boolean validarToken(String token) { return true; }\n}","visualAnalogyOrDiagram":"Sello de lacre en una carta: nadie puede abrirla ni modificar su contenido."}},{"code":"U7.6","title":"Interfaces","keyBadge":"Contrato de Comportamiento","whatItMeans":"Una interfaz es un contrato 100% puro que define qué métodos debe tener una clase sin decir cómo programarlos. Una clase puede implementar múltiples interfaces.","howToUse":"Por convención internacional inician con \"I\" (ej. IImprimible, IMetodoPago). Las clases usan \"implements\" en Java y dos puntos \":\" en C#.","appliedExample":{"scenario":"Diferentes formas de pago (Tarjeta, PayPal, Efectivo)","csharpCode":"// C# .NET\npublic interface IMetodoPago {\n    void ProcesarPago(double monto);\n}","javaCode":"// Java 17+\npublic interface MetodoPago {\n    void procesarPago(double monto);\n}","visualAnalogyOrDiagram":"Enchufe de pared estándar: cualquier aparato (lámpara, laptop) se conecta si respeta las 2 clavijas."}},{"code":"U7.7","title":"Encapsulación Protegida (protected)","keyBadge":"Acceso Familiar","whatItMeans":"Es un nivel de visibilidad intermedio: un atributo o método \"protected\" es visible dentro de la clase y en todas sus clases hijas (la familia de herencia), pero sigue oculto para todo el resto del mundo exterior.","howToUse":"Úsalo cuando quieras que tus subclases tengan acceso directo a una variable interna sin tener que hacerla pública para todo el programa.","appliedExample":{"scenario":"Saldo base accesible para subclases de cuenta","csharpCode":"// C# .NET\npublic class Cuenta {\n    protected double saldo; // Visible para CuentaAhorro, oculta para Program\n}","javaCode":"// Java 17+\npublic class Cuenta {\n    protected double saldo;\n}","visualAnalogyOrDiagram":"Llave de la casa familiar: los miembros de la familia pueden entrar, pero los extraños no."}},{"code":"U7.8","title":"Polimorfismo y Ligadura Dinámica","keyBadge":"Despacho Dinámico","whatItMeans":"Es la magia donde la máquina virtual decide en tiempo de ejecución (en caliente) qué versión del método invocar según el tipo real del objeto en memoria, no según el tipo de la variable.","howToUse":"En C# el método padre debe ser \"virtual\" y la hija \"override\". En Java los métodos son virtuales por defecto y se usa la anotación @Override.","appliedExample":{"scenario":"Lista de figuras calculando su área","csharpCode":"// C# .NET\nList<Figura> figuras = new() { new Circulo(5), new Rectangulo(4, 6) };\nforeach (var f in figuras) {\n    Console.WriteLine(f.CalcularArea()); // Llama a la fórmula correcta de cada una\n}","javaCode":"// Java 17+\nList<Figura> figuras = List.of(new Circulo(5), new Rectangulo(4, 6));\nfor (Figura f : figuras) {\n    System.out.println(f.calcularArea());\n}","visualAnalogyOrDiagram":"El director de orquesta da una sola señal y el violín suena a violín y el tambor a tambor."}}]}},"speakerNotes":"Recorrer los 8 temas de la Unidad 7: desde la definición formal de herencia hasta interfaces y dynamic dispatch polimórfico."},{"id":"c4-s4","slideNumber":4,"type":"topic_breakdown","title":"Módulo Temático 8: Applets y Contenedores Gráficos (U8.1 a U8.6)","subtitle":"Fundamentos de GUI, sandboxing de seguridad web, ciclo de vida y migración moderna","badge":"Temario Oficial · Unidad 8","content":{"topicBreakdown":{"unitCode":"U8","unitTitle":"Introducción a Applets y Contenedores Visuales","summary":"Los 6 conceptos de interfaces gráficas de usuario: del modelo histórico de applets web a componentes de escritorio y contenedores visuales modernos.","topics":[{"code":"U8.1","title":"Características de Applets y GUI","keyBadge":"Interfaz Gráfica","whatItMeans":"Un applet fue la primera tecnología de Java para ejecutar programas interactivos con ventanas y gráficos dentro de un navegador web, sentando las bases de la programación orientada a eventos.","howToUse":"Heredaban de java.applet.Applet. No tenían método main tradicional; respondían a eventos del navegador y dibujaban sobre un lienzo con Graphics g.","appliedExample":{"scenario":"Panel visual dibujado en ventana","csharpCode":"// C# .NET (Equivalente moderno: Windows Forms / WPF / Canvas)\npublic class MiPanelVisual : UserControl {\n    protected override void OnPaint(PaintEventArgs e) {\n        e.Graphics.DrawString(\"Hola GUI\", Font, Brushes.Black, 10, 10);\n    }\n}","javaCode":"// Java 17+ (Histórico Applet / Moderno Swing)\npublic class MiAppletVisual extends javax.swing.JPanel {\n    @Override\n    protected void paintComponent(java.awt.Graphics g) {\n        super.paintComponent(g);\n        g.drawString(\"Hola GUI\", 20, 20);\n    }\n}","visualAnalogyOrDiagram":"Lienzo de dibujo enmarcado que reacciona a los clics del mouse en lugar de texto en consola."}},{"code":"U8.2","title":"Restricciones de Seguridad y Sandbox","keyBadge":"Caja de Arena","whatItMeans":"Por seguridad, los navegadores encerraban a los applets en un entorno aislado (\"sandbox\") para impedir que un programa descargado de internet borrara el disco duro del usuario o leyera sus archivos privados.","howToUse":"Un applet en sandbox no podía leer/escribir archivos locales ni conectarse a servidores distintos al que lo hospedó.","appliedExample":{"scenario":"Regla de seguridad del navegador","csharpCode":"// C# .NET (Sandbox de permisos / WebAssembly moderno)\n// No se permite File.Delete(\"C:\\\\archivo.txt\") sin elevación de privilegios","javaCode":"// Java (SecurityManager histórico)\n// Lanzaba SecurityException ante cualquier intento de acceso al disco local.","visualAnalogyOrDiagram":"Vitrina de cristal blindada en un museo: puedes ver la obra pero no tocarla ni romperla."}},{"code":"U8.3","title":"Escribiendo un Componente Visual","keyBadge":"Lógica Visual","whatItMeans":"Estructurar una clase con controles visuales (botones, etiquetas, cajas de texto) organizados en paneles.","howToUse":"Se importan librerías gráficas (AWT/Swing en Java, System.Windows.Forms en C#) y se agregan controles mediante add(control) en el constructor o método de inicio.","appliedExample":{"scenario":"Formulario con botón y etiqueta","csharpCode":"// C# .NET\nButton btn = new Button { Text = \"Enviar\", Top = 20, Left = 20 };\nbtn.Click += (s, e) => MessageBox.Show(\"¡Clic!\");","javaCode":"// Java 17+\nJButton btn = new JButton(\"Enviar\");\nbtn.addActionListener(e -> JOptionPane.showMessageDialog(null, \"¡Clic!\"));","visualAnalogyOrDiagram":"Tablero de instrumentos: colocas los botones e interruptores en las coordenadas deseadas."}},{"code":"U8.4","title":"Ciclo de Vida (init, start, paint)","keyBadge":"Lifecycle","whatItMeans":"Los métodos ordenados que el sistema invoca durante la vida de la ventana: init() al cargar, start() al hacerse visible, paint() para dibujar en pantalla, y stop()/destroy() al cerrarse.","howToUse":"No se llaman manualmente con código; el runtime los invoca automáticamente cuando la ventana cambia de estado.","appliedExample":{"scenario":"Carga de recursos y refresco visual","csharpCode":"// C# .NET\n// InitializeComponent() -> OnLoad() -> OnPaint() -> OnClosing()","javaCode":"// Java (Ciclo Applet)\n// public void init() { } -> start() { } -> paint(Graphics g) { } -> destroy() { }","visualAnalogyOrDiagram":"Obra de teatro: se monta el escenario (init), sube el telón (start), actúan (paint) y cae el telón (destroy)."}},{"code":"U8.5","title":"Visualización de Interfaces Gráficas","keyBadge":"Contenedores y Layouts","whatItMeans":"Cómo se organizan los componentes en pantalla usando administradores de diseño (FlowLayout, BorderLayout, GridLayout o Grid/StackPanel en C#).","howToUse":"En lugar de poner coordenadas fijas que se rompen al cambiar la resolución, se usan paneles que ajustan el tamaño automáticamente.","appliedExample":{"scenario":"Distribución en panel Norte, Sur y Centro","csharpCode":"// C# .NET (DockPanel o Grid)\nbtn.Dock = DockStyle.Bottom; // Se ancla abajo","javaCode":"// Java 17+\npanel.setLayout(new BorderLayout());\npanel.add(btn, BorderLayout.SOUTH);","visualAnalogyOrDiagram":"Parrilla de una cocina: cada hornilla tiene su lugar asignado y ordenado."}},{"code":"U8.6","title":"Appletviewer y Migración a GUI Moderna","keyBadge":"Evolución Histórica","whatItMeans":"El appletviewer fue una herramienta del JDK para probar applets sin necesidad de navegador. Hoy los navegadores eliminaron Java y la industria migró a Swing/JavaFX en escritorio y HTML5/TypeScript/C# Blazor en la web.","howToUse":"Histórico: appletviewer MiClase.html. Moderno: Desarrollar con frameworks de escritorio (Swing/WPF) o aplicaciones web con frontend separado.","appliedExample":{"scenario":"Transición tecnológica de los 90s al presente","csharpCode":"// C# .NET Moderno: Aplicación WPF / MAUI / Blazor WebAssembly","javaCode":"// Java Moderno: Aplicación JavaFX con FXML o Spring Boot con React","visualAnalogyOrDiagram":"De cintas de casete (Applet) a plataformas de streaming digital (Web moderna)."}}]}},"speakerNotes":"Explicar los 6 temas de la Unidad 8: cómo los applets introdujeron el sandbox y el ciclo de vida (init, start, paint), y su evolución hacia interfaces modernas."},{"id":"c4-s5","slideNumber":5,"type":"core_concept_dual","title":"Concepto Clave: Interfaces en C# y Java","subtitle":"Definición de contratos limpios con \"interface\" e implementación obligatoria","badge":"Contratos de Software","content":{"codeComparison":{"concept":"Interfaz IMetodoPago con implementaciones en Tarjeta y PayPal","csharpCode":"// C# .NET 8\npublic interface IMetodoPago\n{\n    void ProcesarPago(double monto);\n}\n\npublic class PagoTarjeta : IMetodoPago\n{\n    public void ProcesarPago(double monto) =>\n        Console.WriteLine($\"Cobro de ${monto} con tarjeta de crédito (Autorización bancaria).\");\n}\n\npublic class PagoPayPal : IMetodoPago\n{\n    public void ProcesarPago(double monto) =>\n        Console.WriteLine($\"Cobro de ${monto} vía API de PayPal.\");\n}","javaCode":"// Java JDK 17+\npublic interface IMetodoPago {\n    void procesarPago(double monto);\n}\n\npublic class PagoTarjeta implements IMetodoPago {\n    public void procesarPago(double monto) {\n        System.out.println(\"Cobro de $\" + monto + \" con tarjeta de crédito.\");\n    }\n}","explanation":"En C# se implementa con \":\" y en Java con \"implements\". Ambas clases firman el contrato y prometen tener el método ProcesarPago."}},"speakerNotes":"Explicar que nombrar interfaces con una \"I\" al inicio (IMetodoPago) es el estándar universal en C# .NET."},{"id":"c4-s6","slideNumber":6,"type":"instruction_anatomy","title":"Anatomía de la Instrucción: Llamada Polimórfica en una Colección","subtitle":"Cómo un bucle trata a objetos dispares mediante su interfaz común","badge":"⭐ Anatomía Visual de la Instrucción","content":{"instructionAnatomy":{"instructionStatement":"List<IMetodoPago> pagos = new(); pagos.ForEach(p => p.ProcesarPago(100));","statementContext":"La magia del polimorfismo: no hay ningún if o switch verificando si es Tarjeta o PayPal; cada objeto responde solo.","parts":[{"token":"List<IMetodoPago>","name":"1. Colección Genérica de la Interfaz","role":"Declara una lista que acepta cualquier clase del universo que cumpla con el contrato IMetodoPago.","everydayAnalogy":"Una bandeja que acepta cualquier aparato que tenga clavija eléctrica.","color":"purple"},{"token":"pagos.ForEach(...)","name":"2. Iterador Universal","role":"Recorre cada elemento de la colección uno por uno sin importar su tipo concreto real.","everydayAnalogy":"El repartidor entregando paquetes a casas diferentes.","color":"blue"},{"token":"p","name":"3. Elemento Polimórfico","role":"Representa la referencia polimórfica en turno.","everydayAnalogy":"El objeto anónimo que está conectado en ese instante.","color":"amber"},{"token":"p.ProcesarPago(100)","name":"4. Enlace Dinámico en Ejecución (Late Binding)","role":"El entorno de ejecución (CLR / JVM) busca en milisegundos la versión exacta del método que pertenece al objeto real en memoria.","everydayAnalogy":"Presionar el botón de encendido y que el aparato haga lo suyo automáticamente.","color":"emerald"}],"takeaway":"Si mañana creas una nueva clase \"PagoCripto\", no tienes que cambiar ni una sola línea del bucle: el sistema escala limpiamente (Principio Open/Closed)."}},"speakerNotes":"Este es el momento cumbre del curso: cuando los alumnos entienden que el polimorfismo elimina los interminables switch(tipo) { case 1: ... case 2: ... } de la programación novata."},{"id":"c4-s7","slideNumber":7,"type":"simple_example","title":"Ejemplo Sencillo en Vivo: El Reproductor Multimedia","subtitle":"Una lista polimórfica ejecutando diferentes formatos de audio y video","badge":"Código Ejecutable","content":{"simpleExample":{"domainScenario":"Reproducir archivos MP3 y MP4 mediante la interfaz IReproducible.","csharpSnippet":"         slide.content.commonMistakes.forEach(cm => {
          inner += '  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">';
          inner += '    <div class="p-4 rounded-2xl border border-rose-500/30 bg-rose-950/20 space-y-2">';
          inner += '      <strong class="text-rose-400 block">❌ Error Típico:</strong>';
          inner += '      <pre class="font-mono text-[11px] bg-black p-2 rounded text-rose-300">' + escapeHtml(cm.wrongCode) + '</pre>';
          inner += '      <p class="text-rose-200">' + cm.wrongExplanation + '</p>';
          inner += '    </div>';
          inner += '    <div class="p-4 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 space-y-2">';
          inner += '      <strong class="text-emerald-400 block">✅ Forma Correcta:</strong>';
          inner += '      <pre class="font-mono text-[11px] bg-black p-2 rounded text-emerald-300">' + escapeHtml(cm.rightCode) + '</pre>';
          inner += '      <p class="text-emerald-200">' + cm.rightExplanation + '</p>';
          inner += '    </div>';
          inner += '  </div>';
          inner += '  <div class="p-2.5 rounded-xl border border-amber-500/30 bg-amber-950/20 text-xs text-amber-300 text-center font-bold">⭐ Regla de Oro: ' + cm.ruleOfThumb + '</div>';
        });
        inner += '</div>';
      } else if (slide.type === 'classroom_challenge' && slide.content.challenge) {
        const ch = slide.content.challenge;
        inner += '<div class="space-y-4 max-w-xl mx-auto text-center">';
        inner += '  <span class="px-3 py-1 rounded-full bg-amber-500/20 border border-amber-500/30 text-amber-300 font-bold text-xs">⏱️ Tiempo: ' + ch.timeMinutes + ' minutos</span>';
        inner += '  <div class="p-6 rounded-2xl border border-slate-800 bg-black space-y-2">';
        inner += '    <h3 class="text-xl font-bold text-white">' + ch.question + '</h3>';
        inner += '    <p class="text-xs text-slate-300">' + ch.instructions + '</p>';
        inner += '  </div>';
        inner += '  <div class="p-4 rounded-xl border border-emerald-500/30 bg-emerald-950/20 text-xs text-emerald-300 text-left"><strong>✓ Respuesta Sugerida:</strong><p class="mt-1">' + ch.expectedAnswer + '</p></div>';
        inner += '</div>';
      } else if (slide.type === 'weekly_activity_bridge' && slide.content.activityBridge) {
        const ab = slide.content.activityBridge;
        inner += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">';
        inner += '  <div class="p-4 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-black text-[10px] uppercase">Actividad 1: Básica</span><h4 class="font-bold text-white">' + ab.act1Title + '</h4><p class="text-slate-400">' + ab.act1Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-blue-500/30 bg-blue-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-black text-[10px] uppercase">Actividad 2: Intermedia</span><h4 class="font-bold text-white">' + ab.act2Title + '</h4><p class="text-slate-400">' + ab.act2Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-purple-500/30 bg-purple-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-black text-[10px] uppercase">Actividad 3: Entregable</span><h4 class="font-bold text-white">' + ab.act3Title + '</h4><p class="text-slate-400">' + ab.act3Desc + '</p></div>';
        inner += '</div>';
      }

      card.innerHTML = inner;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = slides.length - 1;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function selectAnatomy(idx) {
      selectedAnatomyIndex = idx;
      renderSlide();
    }

    function selectTopic(idx) {
      selectedTopicIndex = idx;
      renderSlide();
    }

    function toggleTopicGrid() {
      showAllTopicsGrid = !showAllTopicsGrid;
      renderSlide();
    }

    function toggleLang() {
      currentLang = currentLang === 'csharp' ? 'java' : 'csharp';
      const btn = document.getElementById('btn-lang');
      btn.textContent = currentLang === 'csharp' ? 'C# .NET' : 'Java 17';
      btn.className = currentLang === 'csharp'
        ? 'px-2.5 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold transition-all'
        : 'px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 text-xs font-black transition-all';
      renderSlide();
    }

    function toggleTheme() {
      isDark = !isDark;
      document.body.className = isDark
        ? 'bg-slate-950 text-slate-100 min-h-screen flex flex-col'
        : 'bg-slate-100 text-slate-900 min-h-screen flex flex-col';
      const card = document.getElementById('slide-card');
      if (card) {
        card.className = isDark
          ? 'bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl min-h-[580px] flex flex-col justify-between transition-all'
          : 'bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-xl min-h-[580px] flex flex-col justify-between transition-all';
      }
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    renderSlide();
  </script>
</body>
</html>
