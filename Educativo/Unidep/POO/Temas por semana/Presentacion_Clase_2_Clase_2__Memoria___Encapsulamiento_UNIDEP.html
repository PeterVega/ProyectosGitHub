  <script>
    const slides = [{"id":"c2-s1","slideNumber":1,"type":"cover","title":"Memoria Stack vs. Heap y el Principio de Encapsulamiento","subtitle":"Por qué no debes permitir que cualquiera modifique el saldo de una cuenta bancaria a su antojo","badge":"Semana 2 · Cátedra Oficial","content":{"leadText":"Hoy descubriremos dónde viven los objetos en tu memoria RAM y cómo crear una \"caja fuerte\" alrededor de tus datos.","bulletPoints":[{"icon":"🧠","title":"La Memoria del Computador","desc":"Stack (punteros rápidos y variables locales) vs. Heap (espacio dinámico donde nacen los objetos creados con new)."},{"icon":"🛡️","title":"Encapsulamiento y Protección","desc":"Atributos privados (private) y accesores controlados (getters/setters y properties con validación)."},{"icon":"🔑","title":"La Palabra Clave \"this\"","desc":"Resolver la ambigüedad entre parámetros recibidos y atributos internos del objeto."}]},"speakerNotes":"Iniciar preguntando: \"¿Dejarías que un cajero automático tenga una variable pública donde cualquiera pueda escribir saldo = 1000000000?\". La respuesta es no: ahí entra el encapsulamiento."},{"id":"c2-s2","slideNumber":2,"type":"real_world_analogy","title":"El Problema de la Memoria: Stack vs. Heap en la Vida Real","subtitle":"El control remoto en tu mano (Stack) y la pantalla gigante en la pared (Heap)","badge":"Visualización de Memoria","content":{"imageUrl":"/src/assets/images/memory_stack_heap_1791519170579.jpg","imageCaption":"El Stack almacena las referencias ordenadas y rápidas; el Heap guarda los objetos voluminosos y dinámicos.","analogyBox":{"title":"La Ficha del Guardarropa y el Abrigo","analogy":"Cuando vas a un teatro, no cargas tu abrigo pesado en tu bolsillo. Te dan una ficha de plástico con el número \"42\". La ficha de plástico ligera vive en tu bolsillo (Memoria Stack). Tu abrigo pesado de lana cuelga en el armario grande al fondo (Memoria Heap). Si pierdes la ficha, tu abrigo sigue en el armario pero no puedes alcanzarlo (fuga de memoria / objeto huérfano).","moral":"Las variables en POO no son el objeto en sí; son la ficha de plástico con la dirección para encontrarlo."}},"speakerNotes":"Mostrar la imagen de Stack vs Heap. Explicar cómo el Garbage Collector de .NET y Java barre los objetos huérfanos sin ficha."},{"id":"c2-s3","slideNumber":3,"type":"topic_breakdown","title":"Módulo Temático 3: Metodología OO y Miembros (U3.1 a U3.6)","subtitle":"Análisis, declaración de clases, atributos, métodos, operador punto y la referencia this","badge":"Temario Oficial · Unidad 3","content":{"topicBreakdown":{"unitCode":"U3","unitTitle":"Programación Orientada a Objetos: Declaración y Miembros","summary":"Las 6 normas metodológicas y sintácticas para estructurar miembros de clases y desambiguar referencias con this.","topics":[{"code":"U3.1","title":"Análisis y Diseño Orientado a Objetos","keyBadge":"Metodología","whatItMeans":"Es el proceso de leer los requerimientos de un problema en español y transformarlos en clases: los sustantivos se convierten en clases, los adjetivos en atributos y los verbos en métodos.","howToUse":"Se identifican los actores y entidades clave antes de escribir código. Se dibuja un diagrama UML rápido para validar relaciones y responsabilidades únicas.","appliedExample":{"scenario":"\"Un cliente realiza pedidos de productos\"","csharpCode":"// C# .NET\n// Clases resultantes: Cliente, Pedido, Producto\npublic class Pedido { public Cliente Comprador { get; set; } }","javaCode":"// Java 17+\npublic class Pedido { private Cliente comprador; }","visualAnalogyOrDiagram":"Texto en lenguaje natural ──[Análisis]──> Clases + Atributos + Métodos"}},{"code":"U3.2","title":"Declaración de Clases","keyBadge":"Arquitectura","whatItMeans":"Es la especificación formal del contrato de la clase con sus modificadores de visibilidad (public, internal, etc.).","howToUse":"En Java cada clase pública va en su propio archivo .java. En C# una clase puede definirse en archivos limpios con namespaces.","appliedExample":{"scenario":"Clase de servicio bancario","csharpCode":"// C# .NET\npublic class GestorCuentas {\n    // Lógica del gestor\n}","javaCode":"// Java 17+\npublic class GestorCuentas {\n    // Lógica del gestor\n}","visualAnalogyOrDiagram":"Plano técnico con membrete y especificaciones formales."}},{"code":"U3.3","title":"Declaración de Atributos","keyBadge":"Estado del Objeto","whatItMeans":"Son las variables que viven dentro del objeto en el Heap y representan su estado. Cada objeto tiene su propia copia independiente de estos atributos.","howToUse":"Deben tener un tipo de dato explícito (int, double, string, boolean) y casi siempre visibilidad private para respetar el encapsulamiento.","appliedExample":{"scenario":"Atributos de una cuenta de ahorros","csharpCode":"// C# .NET\nprivate string numeroCuenta;\nprivate double saldoActual;\nprivate bool estaActiva;","javaCode":"// Java 17+\nprivate String numeroCuenta;\nprivate double saldoActual;\nprivate boolean estaActiva;","visualAnalogyOrDiagram":"Ficha médica: campos con nombre, tipo de sangre y antecedentes del paciente."}},{"code":"U3.4","title":"Declaración de Métodos","keyBadge":"Comportamiento","whatItMeans":"Son los bloques de código que operan sobre los atributos del objeto para realizar cálculos, comprobaciones o cambios de estado.","howToUse":"Deben tener nombres de verbos claros (ej. ProcesarPago, CalcularInteres). Si no retornan nada, se usa void; si devuelven un cálculo, se indica el tipo de dato retornado.","appliedExample":{"scenario":"Operación de retiro con verificación","csharpCode":"// C# .NET\npublic bool Retirar(double monto) {\n    if (monto <= saldoActual) { saldoActual -= monto; return true; }\n    return false;\n}","javaCode":"// Java 17+\npublic boolean retirar(double monto) {\n    if (monto <= saldoActual) { this.saldoActual -= monto; return true; }\n    return false;\n}","visualAnalogyOrDiagram":"Caja negra: recibe monto -> verifica saldo -> descuenta -> responde éxito/fracaso."}},{"code":"U3.5","title":"Acceso a Miembros de un Objeto","keyBadge":"Operador Punto","whatItMeans":"Es la forma en que el programador invoca un método o consulta una propiedad del objeto mediante la referencia que tiene en la variable.","howToUse":"Se escribe nombreVariable.miembro. Si la variable vale null, la computadora lanzará el error NullReferenceException o NullPointerException.","appliedExample":{"scenario":"Uso de un cliente instanciado","csharpCode":"// C# .NET\nCliente cli = new Cliente(\"Ana Lopez\");\nstring nombre = cli.ObtenerNombreCompleto();","javaCode":"// Java 17+\nCliente cli = new Cliente(\"Ana Lopez\");\nString nombre = cli.obtenerNombreCompleto();","visualAnalogyOrDiagram":"Variable en Stack (Puntero láser) ──apunta a──> Objeto real en Heap"}},{"code":"U3.6","title":"Referencia this","keyBadge":"Auto-referencia","whatItMeans":"Es una palabra clave que representa \"yo mismo\". Se refiere al objeto específico que está ejecutando el método en este momento.","howToUse":"Se utiliza principalmente para desambiguar cuando el nombre de un parámetro es idéntico al del atributo de la clase (ej. this.saldo = saldo) y para encadenar constructores.","appliedExample":{"scenario":"Constructor asignando parámetros homónimos","csharpCode":"// C# .NET\npublic Cuenta(double saldo) {\n    this.saldo = saldo; // this.saldo es el atributo, saldo es el parámetro\n}","javaCode":"// Java 17+\npublic Cuenta(double saldo) {\n    this.saldo = saldo;\n}","visualAnalogyOrDiagram":"Pronombre \"Yo\": aclara si me refiero a mi propio bolsillo o al dinero que me entregan en la mano."}}]}},"speakerNotes":"Explicar los 6 temas de la Unidad 3: desde el análisis orientado a objetos hasta el operador punto y la referencia this."},{"id":"c2-s4","slideNumber":4,"type":"topic_breakdown","title":"Módulo Temático 4: Expresiones y Operadores (U4.1 a U4.7)","subtitle":"Alcance Stack vs Heap, inicialización, operadores lógicos, aritméticos, relacionales y de bits","badge":"Temario Oficial · Unidad 4","content":{"topicBreakdown":{"unitCode":"U4","unitTitle":"Expresiones Computacionales y Operadores de Control","summary":"Los 7 conceptos esenciales de evaluación de expresiones cuantitativas, precedencia y manipulación en memoria.","topics":[{"code":"U4.1","title":"Variables y su Alcance (Scope)","keyBadge":"Memoria Stack vs Heap","whatItMeans":"El alcance determina dónde una variable existe y es visible. Las variables locales viven dentro de un método en la memoria rápida (Stack) y mueren al salir del bloque. Los atributos viven en los objetos (Heap) mientras el objeto siga vivo.","howToUse":"Declara las variables en el bloque más pequeño posible donde se necesiten para ahorrar memoria y prevenir errores de modificación accidental.","appliedExample":{"scenario":"Variable temporal de cálculo vs atributo permanente","csharpCode":"// C# .NET\npublic void Calcular() {\n    int factorTemporal = 2; // Nace y muere aquí en el Stack\n    this.total = this.baseCalculo * factorTemporal;\n}","javaCode":"// Java 17+\npublic void calcular() {\n    int factorTemporal = 2;\n    this.total = this.baseCalculo * factorTemporal;\n}","visualAnalogyOrDiagram":"Post-it temporal en tu mano (Stack) vs Documento archivado en el cajón (Heap)."}},{"code":"U4.2","title":"Inicialización de Variables","keyBadge":"Valores por Defecto","whatItMeans":"Es darle su primer valor a una variable. Los atributos de los objetos se inicializan por defecto automáticamente (0 para números, false para booleanos, null para referencias). Las variables locales de un método exigen inicialización explícita antes de usarse.","howToUse":"Siempre asigna un valor inicial conocido a tus variables locales para evitar errores de compilación (\"variable no asignada\").","appliedExample":{"scenario":"Acumulador de suma inicializado en cero","csharpCode":"// C# .NET\ndouble acumulador = 0.0; // Inicialización explícita obligatoria\nacumulador += 150.50;","javaCode":"// Java 17+\ndouble acumulador = 0.0;\nacumulador += 150.50;","visualAnalogyOrDiagram":"Pizarra limpia: antes de escribir el total, debes borrarla y dejarla en cero."}},{"code":"U4.3","title":"Operadores y Precedencia","keyBadge":"Expresiones Matemáticas","whatItMeans":"Determina el orden estricto en que la computadora evalúa los cálculos. La multiplicación y división ocurren antes que la suma y la resta.","howToUse":"Usa paréntesis ( ) siempre que quieras garantizar el orden exacto de una operación y mejorar la legibilidad para otros programadores.","appliedExample":{"scenario":"Cálculo de promedio con ponderación","csharpCode":"// C# .NET\ndouble promedio = (nota1 + nota2 + nota3) / 3.0; // Con paréntesis correcto","javaCode":"// Java 17+\ndouble promedio = (nota1 + nota2 + nota3) / 3.0;","visualAnalogyOrDiagram":"Jerarquía de operaciones: Paréntesis () > Multiplicación/División */% > Suma/Resta +-"}},{"code":"U4.4","title":"Operadores Lógicos (&&, ||, !)","keyBadge":"Evaluación Cortocircuito","whatItMeans":"Permiten combinar condiciones: AND (&&) exige que ambas sean verdaderas; OR (||) exige que al menos una lo sea; NOT (!) invierte el resultado. Usan cortocircuito: si el primer término de && es falso, ya no evalúa el segundo.","howToUse":"Aprovecha el cortocircuito para evitar caídas: if (cliente != null && cliente.TieneCredito) nunca fallará con null.","appliedExample":{"scenario":"Aprobación de préstamo hipotecario","csharpCode":"// C# .NET\nbool apto = (edad >= 21) && (ingresos > 15000) && (!tieneDeudaMorosa);","javaCode":"// Java 17+\nboolean apto = (edad >= 21) && (ingresos > 15000) && (!tieneDeudaMorosa);","visualAnalogyOrDiagram":"Cerradura doble: necesitas la Llave A Y la Llave B para abrir la puerta de seguridad."}},{"code":"U4.5","title":"Operadores Aritméticos (+, -, *, /, %)","keyBadge":"Cálculos Cuantitativos","whatItMeans":"Suma (+), resta (-), multiplicación (*), división (/) y residuo/módulo (%). Ojo: dividir dos enteros (ej. 7 / 2) da 3 en lugar de 3.5 porque trunca los decimales.","howToUse":"Si quieres decimales, asegúrate de que al menos uno de los números sea double o float (ej. 7.0 / 2 o (double)a / b). Usa % para saber si un número es par (n % 2 == 0).","appliedExample":{"scenario":"Distribución de elementos en grupos y sobrantes","csharpCode":"// C# .NET\nint cajasCompletas = items / 12;\nint sobrantes = items % 12; // Módulo residuo","javaCode":"// Java 17+\nint cajasCompletas = items / 12;\nint sobrantes = items % 12;","visualAnalogyOrDiagram":"Repartir 10 manzanas entre 3 niños: 3 manzanas a cada uno y sobra 1 (10 % 3 = 1)."}},{"code":"U4.6","title":"Operadores Relacionales (==, !=, <, >, <=, >=)","keyBadge":"Comparaciones","whatItMeans":"Comparan dos valores y siempre devuelven un booleano (true o false). En tipos primitivos comparan su valor numérico; en objetos en Java, == compara si apuntan a la misma dirección de memoria (usa .equals() para comparar texto).","howToUse":"En Java para comparar cadenas usa: texto1.equals(texto2). En C# el operador == ya está sobrecargado para comparar el contenido del texto.","appliedExample":{"scenario":"Validación de saldo suficiente para compra","csharpCode":"// C# .NET\nbool puedeComprar = saldoDisponible >= costoProducto;","javaCode":"// Java 17+\nboolean puedeComprar = saldoDisponible >= costoProducto;\nboolean mismoNombre = usuario1.getNombre().equals(usuario2.getNombre());","visualAnalogyOrDiagram":"Balanza de platillos: devuelve SI o NO según cuál platillo esté más pesado o si están iguales."}},{"code":"U4.7","title":"Operadores a Nivel de Bits (&, |, ^, ~, <<, >>)","keyBadge":"Operaciones Binarias","whatItMeans":"Manipulan directamente los ceros y unos de la memoria binaria. Se usan para permisos, banderas de configuración, compresión y criptografía.","howToUse":"El operador & aplica AND bit a bit, | aplica OR bit a bit, ^ es XOR (exclusivo), y << desplaza bits a la izquierda (equivale a multiplicar por 2 rápidamente).","appliedExample":{"scenario":"Sistema de roles y permisos con máscara de bits","csharpCode":"// C# .NET\nconst int LEER = 1;     // 0001\nconst int ESCRIBIR = 2; // 0010\nint permisoUsuario = LEER | ESCRIBIR; // 0011 (Tiene ambos permisos)\nbool puedeEscribir = (permisoUsuario & ESCRIBIR) != 0;","javaCode":"// Java 17+\nint LEER = 1, ESCRIBIR = 2;\nint permiso = LEER | ESCRIBIR;\nboolean puedeEscribir = (permiso & ESCRIBIR) != 0;","visualAnalogyOrDiagram":"Tablero de 4 interruptores: cada bit [0 0 1 1] enciende o apaga una función específica."}}]}},"speakerNotes":"Explicar los 7 temas de la Unidad 4: variables locales en Stack vs atributos en Heap, operadores aritméticos, lógicos con cortocircuito y máscaras de bits."},{"id":"c2-s5","slideNumber":5,"type":"core_concept_dual","title":"Concepto Clave: Encapsulamiento con Propiedades en C# y Java","subtitle":"Protege las variables privadas de valores absurdos (como edad negativa o saldo nulo)","badge":"Patrón de Encapsulamiento","content":{"codeComparison":{"concept":"Propiedad con validación para evitar números negativos","csharpCode":"// C# .NET 8: Propiedad con Respaldo\npublic class CuentaBancaria\n{\n    private double _saldo; // Caja fuerte privada\n\n    public double Saldo\n    {\n        get => _saldo;\n        set\n        {\n            if (value >= 0)\n                _saldo = value;\n            else\n                Console.WriteLine(\"Error: Saldo no puede ser negativo\");\n        }\n    }\n}","javaCode":"// Java: Getters y Setters tradicionales\npublic class CuentaBancaria {\n    private double saldo; // Caja fuerte privada\n\n    public double getSaldo() {\n        return this.saldo;\n    }\n\n    public void setSaldo(double nuevoSaldo) {\n        if (nuevoSaldo >= 0) {\n            this.saldo = nuevoSaldo;\n        } else {\n            System.out.println(\"Error: Saldo no puede ser negativo\");\n        }\n    }\n}","explanation":"En ambos casos, ningún programador externo puede hacer \"cuenta.saldo = -500\". El acceso pasa obligatoriamente por el guardia de seguridad (la validación)."}},"speakerNotes":"Resaltar la elegancia de las Properties de C# frente a los tradicionales getters/setters de Java, aunque la filosofía protectora es idéntica."},{"id":"c2-s6","slideNumber":6,"type":"instruction_anatomy","title":"Anatomía de la Instrucción: Propiedad con Validación Defensiva","subtitle":"Desglose de la sintaxis de una propiedad en C#","badge":"⭐ Anatomía Visual de la Instrucción","content":{"instructionAnatomy":{"instructionStatement":"public double Saldo { get => _saldo; set { if (value >= 0) _saldo = value; } }","statementContext":"Esta propiedad compacta reemplaza cientos de líneas de código y blinda la integridad de la cuenta bancaria.","parts":[{"token":"public","name":"1. Modificador Público","role":"Permite que cualquier parte del sistema consulte o intente modificar el saldo a través de esta puerta.","everydayAnalogy":"La ventanilla abierta al público en una sucursal bancaria.","color":"emerald"},{"token":"double Saldo","name":"2. Tipo y Nombre de Propiedad","role":"Declara el nombre visible de la propiedad en PascalCase y el tipo de dato que maneja (decimales).","everydayAnalogy":"El letrero que dice \"Consulta de Saldo en Pesos\".","color":"blue"},{"token":"get => _saldo;","name":"3. Accesor de Lectura (Getter)","role":"Devuelve el valor privado al exterior cuando alguien hace \"Console.WriteLine(c.Saldo)\".","everydayAnalogy":"La pantalla que te muestra tu saldo en el cajero sin dejarte tocar el dinero.","color":"purple"},{"token":"set","name":"4. Accesor de Escritura (Setter)","role":"Se activa automáticamente cuando alguien intenta asignar un valor con \"c.Saldo = 100\".","everydayAnalogy":"La ranura para depositar billetes.","color":"amber"},{"token":"value","name":"5. Palabra Clave \"value\"","role":"Palabra reservada en C# que contiene el dato que el usuario intentó guardar.","everydayAnalogy":"El fajo de billetes que el cliente acaba de entregar en la ventanilla.","color":"rose"},{"token":"if (value >= 0) _saldo = value;","name":"6. Regla de Validación","role":"Filtro de seguridad que valida el dato antes de guardarlo en la variable privada real.","everydayAnalogy":"El detector de billetes falsos que rechaza el dinero si algo no coincide.","color":"cyan"}],"takeaway":"El encapsulamiento convierte a tus objetos en entidades responsables de su propia salud interna."}},"speakerNotes":"Pedir que observen la palabra mágica \"value\" en C#. Explicar que equivale al parámetro que en Java recibiría el método setSaldo(double nuevoSaldo)."},{"id":"c2-s7","slideNumber":7,"type":"simple_example","title":"Ejemplo Sencillo en Vivo: Termómetro Inteligente","subtitle":"Validación de temperatura en grados Celsius que rechaza el cero absoluto imposible","badge":"Ejemplo Práctico","content":{"simpleExample":{"domainScenario":"Crear un termómetro digital que solo acepte temperaturas mayores a -273.15 °C (cero absoluto físico).","csharpSnippet":"using System;\n\npublic class Termometro\n{\n    private double _celsius;\n\n    public double Celsius\n    {\n        get => _celsius;\n        set\n        {\n            if (value >= -273.15)\n                _celsius = value;\n            else\n                Console.WriteLine(\"⚠️ Error: Temperatura por debajo del cero absoluto imposible.\");\n        }\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        Termometro t = new Termometro();\n        t.Celsius = 25.5;  // Asignación válida\n        Console.WriteLine($\"Temperatura actual: {t.Celsius} °C\");\n\n        t.Celsius = -500;  // Asignación inválida rechazada\n        Console.WriteLine($\"Temperatura protegida: {t.Celsius} °C\");\n    }\n}","javaSnippet":"public class Termometro {\n    private double celsius;\n\n    public double getCelsius() { return this.celsius; }\n    public void setCelsius(double val) {\n        if (val >= -273.15) this.celsius = val;\n        else System.out.println(\"⚠️ Error: Temperatura imposible.\");\n    }\n    public static void main(String[] args) {\n           inner += '    </div>';
          inner += '  </div>';
          inner += '  <div class="p-2.5 rounded-xl border border-amber-500/30 bg-amber-950/20 text-xs text-amber-300 text-center font-bold">⭐ Regla de Oro: ' + cm.ruleOfThumb + '</div>';
        });
        inner += '</div>';
      } else if (slide.type === 'classroom_challenge' && slide.content.challenge) {
        const ch = slide.content.challenge;
        inner += '<div class="space-y-4 max-w-xl mx-auto text-center">';
        inner += '  <span class="px-3 py-1 rounded-full bg-amber-500/20 border border-amber-500/30 text-amber-300 font-bold text-xs">⏱️ Tiempo: ' + ch.timeMinutes + ' minutos</span>';
        inner += '  <div class="p-6 rounded-2xl border border-slate-800 bg-black space-y-2">';
        inner += '    <h3 class="text-xl font-bold text-white">' + ch.question + '</h3>';
        inner += '    <p class="text-xs text-slate-300">' + ch.instructions + '</p>';
        inner += '  </div>';
        inner += '  <div class="p-4 rounded-xl border border-emerald-500/30 bg-emerald-950/20 text-xs text-emerald-300 text-left"><strong>✓ Respuesta Sugerida:</strong><p class="mt-1">' + ch.expectedAnswer + '</p></div>';
        inner += '</div>';
      } else if (slide.type === 'weekly_activity_bridge' && slide.content.activityBridge) {
        const ab = slide.content.activityBridge;
        inner += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">';
        inner += '  <div class="p-4 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-black text-[10px] uppercase">Actividad 1: Básica</span><h4 class="font-bold text-white">' + ab.act1Title + '</h4><p class="text-slate-400">' + ab.act1Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-blue-500/30 bg-blue-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-black text-[10px] uppercase">Actividad 2: Intermedia</span><h4 class="font-bold text-white">' + ab.act2Title + '</h4><p class="text-slate-400">' + ab.act2Desc + '</p></div>';
        inner += '  <div class="p-4 rounded-2xl border border-purple-500/30 bg-purple-950/20 space-y-1"><span class="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-black text-[10px] uppercase">Actividad 3: Entregable</span><h4 class="font-bold text-white">' + ab.act3Title + '</h4><p class="text-slate-400">' + ab.act3Desc + '</p></div>';
        inner += '</div>';
      }

      card.innerHTML = inner;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = slides.length - 1;
      }
      selectedAnatomyIndex = 0;
      selectedTopicIndex = 0;
      showAllTopicsGrid = false;
      renderSlide();
    }

    function selectAnatomy(idx) {
      selectedAnatomyIndex = idx;
      renderSlide();
    }

    function selectTopic(idx) {
      selectedTopicIndex = idx;
      renderSlide();
    }

    function toggleTopicGrid() {
      showAllTopicsGrid = !showAllTopicsGrid;
      renderSlide();
    }

    function toggleLang() {
      currentLang = currentLang === 'csharp' ? 'java' : 'csharp';
      const btn = document.getElementById('btn-lang');
      btn.textContent = currentLang === 'csharp' ? 'C# .NET' : 'Java 17';
      btn.className = currentLang === 'csharp'
        ? 'px-2.5 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold transition-all'
        : 'px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 text-xs font-black transition-all';
      renderSlide();
    }

    function toggleTheme() {
      isDark = !isDark;
      document.body.className = isDark
        ? 'bg-slate-950 text-slate-100 min-h-screen flex flex-col'
        : 'bg-slate-100 text-slate-900 min-h-screen flex flex-col';
      const card = document.getElementById('slide-card');
      if (card) {
        card.className = isDark
          ? 'bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl min-h-[580px] flex flex-col justify-between transition-all'
          : 'bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-xl min-h-[580px] flex flex-col justify-between transition-all';
      }
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    renderSlide();
  </script>
</body>
</html>
